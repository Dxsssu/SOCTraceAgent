name: socagent-excytin

x-mysql-common: &mysql-common
  image: ${EXCYTIN_MYSQL_IMAGE:-mysql:9.0}
  restart: unless-stopped
  environment: &mysql-environment
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    MYSQL_ROOT_HOST: "%"
    MYSQL_DATABASE: ${EXCYTIN_DATABASE:-env_monitor_db}
  command:
    - --secure-file-priv=/var/lib/mysql-files
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "mysql --host=localhost --user=root --password=$$MYSQL_ROOT_PASSWORD --batch --skip-column-names --execute=\"SELECT status FROM socagent_control.import_status WHERE status='complete'\" 2>/dev/null | grep -qx complete",
      ]
    interval: 10s
    timeout: 5s
    retries: 60
    start_period: 60s

services:
  incident_5:
    <<: *mysql-common
    container_name: incident_5
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - incident_5_data:/var/lib/mysql
      - ../../data/excytin-bench/mysql/data_anonymized/incidents/incident_5:/var/lib/mysql-files:ro
      - ./generated/incident_5.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

  incident_38:
