name: socagent-memory

services:
  neo4j:
    image: neo4j:2026.07.1
    container_name: socagent-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL_SIZE:-512m}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX_SIZE:-1G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE_SIZE:-512m}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:7474/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

volumes:
  neo4j_data:
    name: socagent-neo4j-data
  neo4j_logs:
    name: socagent-neo4j-logs
