    - 在 DeviceFileEvents 按 InitiatingProcessFileName 查询 FileName、FolderPath、DeviceName、Timestamp、ActionType、InitiatingProcessId、InitiatingProcessCommandLine；结合已确认的设备、进程和事件时间范围。
    outputs:
