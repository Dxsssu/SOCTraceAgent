    constraints:
    - 仅接受确认来自 UrlClickEvents 的 ReportId，不能使用其他表的同名标识。
    - 回查同一条事件不能证明发生另一场点击；多个候选按时间、账户和题目关系核对，不能自动把一条旧 URL 当新事件答案。
- id: empty_time_scope_diagnostic
  requires:
  - empty_time_scope
  produces:
  - scope_diagnostic
  intents: []
  recovery_trigger: empty_time_scope
  source_rule:
    table: SigninLogs
    filters:
    - IPAddress
    projection_any:
    - IPAddress
  dependencies:
    SigninLogs:
    - IPAddress
    - TimeGenerated
    EmailEvents:
    - SenderFromAddress
    - TimeGenerated
    DeviceProcessEvents:
    - DeviceName
    - Timestamp
  card:
    name: 空结果后的时间范围核对
    inputs:
    - 最近一次查询成功但为空，且同时包含精确实体条件与时间条件
    steps:
    - 核对时间条件来自哪里：如果把告警时间误作精确事件时间，先保留全部非时间条件，查询该实体的实际事件时间和值，诊断时间范围。使用 SQL 中实际表和时间列：SigninLogs/EmailEvents
      的 TimeGenerated，DeviceProcessEvents 的 Timestamp。
    - 根据返回时间与题目事件关系重新限定范围，再继续原调查。题目明确要求的时间范围不能静默删除；诊断查询的结果仅为候选。
    outputs:
    - 实际时间分布及范围差异，供后续限定查询
    constraints:
    - 空结果不证明时间条件错误；不能借此改变账户、IP、主机或题目目标。
    - 若诊断结果与题目时间冲突，记录冲突并继续核对，不能把范围外记录直接当答案。
    - 恢复提示不是已执行证据，不会直接解锁新实体类型。
- id: empty_alert_device_scope_diagnostic
  requires:
  - empty_alert_device_scope
  produces:
  - scope_diagnostic
  intents: []
  recovery_trigger: empty_alert_device_scope
  source_rule:
    table: AlertEvidence
    filters:
    - AlertId
    projection_any:
    - AccountName
    - AccountSid
  dependencies:
    AlertEvidence:
    - AlertId
    - DeviceName
    - EntityType
    - EvidenceRole
    - AccountName
    - AccountSid
    - ProcessCommandLine
  card:
    name: 告警证据空结果后的跨行实体核对
    inputs:
    - 最近一次 AlertEvidence 查询按 AlertId 和 DeviceName 筛选但返回为空
    steps:
    - 保留原查询的全部 AlertId 及其他非设备条件，诊断性查询同一告警内的证据行，返回 AlertId、DeviceName、EntityType、EvidenceRole
      及当前所需账户或进程字段。
    - 按 AlertId 分组检查设备、账户、进程是否分散在不同记录；用设备全名和角色字段核对原条件，必要时查询原始告警实体以确认关系。
    outputs:
    - 同一告警内候选实体及尚待核对的关联
    constraints:
    - 同一告警包含多个实体不证明任意两者直接相关；不能把不同证据行的主机、SID、进程拼成一条已证实事实。
    - 设备筛选为空也可能是设备名不匹配或告警选择错误；移除筛选只用于诊断，不能自动宣布新候选属于原目标设备。
- id: empty_url_form_diagnostic
  requires:
  - empty_url_form
  produces:
  - scope_diagnostic
  intents: []
  recovery_trigger: empty_url_form
  source_rule:
    table: DeviceNetworkEvents
    filters:
    - RemoteUrl
    projection_any:
    - RemoteUrl
  dependencies:
    DeviceNetworkEvents:
    - RemoteUrl
    - LocalIP
    - RemoteIP
    - Timestamp
    UrlClickEvents:
    - Url
    - AccountUpn
    - Timestamp
    - ActionType
  card:
    name: URL 精确查询为空后的存储形式核对
    inputs:
    - 最近一次在 DeviceNetworkEvents.RemoteUrl 或 UrlClickEvents.Url 上精确匹配 URL 但为空
    steps:
    - 保留已确认的账户、主机和事件范围，先按完整主机名发现 URL 候选，返回实际 URL 与相应时间、账户或网络实体字段；核对协议、端口、路径、末尾斜杠和子域。
    - 子串匹配只用于发现候选，随后按完整实际 URL 与目标关系验证；如需扩大到父域，明确其可能引入兄弟子域及其他事件。
    outputs:
    - 实际 URL 形式及范围内候选
    constraints:
    - http 与 https、不同端口和路径不能自动视为相同 URL；不能为了匹配参考形式而改写观察值。
    - 空结果不证明只是格式问题；若实际时间或实体与题目冲突，应保留冲突，不把扩大查询范围当作确认。
- id: empty_parent_role_diagnostic
  requires:
  - empty_parent_role
  produces:
  - scope_diagnostic
  intents: []
  recovery_trigger: empty_parent_role
  source_rule:
    table: DeviceProcessEvents
    filters:
    - FileName
    projection_any:
    - ProcessCommandLine
  dependencies:
    DeviceProcessEvents:
    - FileName
    - InitiatingProcessFileName
    - ProcessId
    - InitiatingProcessId
    - ProcessCommandLine
    - InitiatingProcessCommandLine
    - DeviceName
    - Timestamp
  card:
    name: 父进程文件名查询为空后的角色核对
    inputs:
    - 最近一次按 DeviceProcessEvents.InitiatingProcessFileName 精确查询但为空
    steps:
    - 在原设备和事件范围内分别检查 FileName 与 InitiatingProcessFileName 是否包含目标程序，返回两者及 ProcessId、InitiatingProcessId、ProcessCommandLine、InitiatingProcessCommandLine、DeviceName、Timestamp。
    - 标注目标程序在每行是当前进程还是发起进程；若名称仅部分匹配，核对完整文件名，保留父子关联后再回答题目。
    outputs:
    - 程序候选及父子角色
    constraints:
    - 目标作为当前进程出现不代表它是被查询进程的父进程；不得互换两种命令行或 PID。
    - 文件名相似不证明同一程序，空结果也不证明角色错误；诊断后仍需确认题目要求的进程身份。
