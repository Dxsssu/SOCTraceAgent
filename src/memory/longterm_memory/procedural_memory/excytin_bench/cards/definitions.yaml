    projection_any:
    - ProcessId
    - ProcessCommandLine
  dependencies:
    DeviceProcessEvents:
    - DeviceName
    - Timestamp
    - ProcessId
    - ProcessCreationTime
    - FileName
    - ProcessCommandLine
    - InitiatingProcessId
    - InitiatingProcessCommandLine
  card:
    name: 在已确认设备上查询进程活动
    inputs:
    - device_name
    steps:
    - 在 DeviceProcessEvents 按 DeviceName 查询 Timestamp、ProcessId、ProcessCreationTime、FileName、ProcessCommandLine、InitiatingProcessId、InitiatingProcessCommandLine，并返回
      DeviceName；有证据支持的事件时间范围时加入筛选。
    outputs:
    - process
    - command
    constraints:
    - 设备上的所有进程不都属于目标攻击；根据事件、父子关系和命令继续收敛。
    - 截断或大量候选时细化查询范围，不把第一条记录当答案；检测时间不自动等于进程创建时间。
