    outputs:
    - account_upn
    constraints:
    - 仅用于尚无精确账户的风险事件调查；多个账户必须结合目标事件验证，风险状态本身不证明账户已被攻陷。
    - 该操作不提供登录 IP 或邮件发送 IP；必须从对应事件表获得，不能混用来源。
