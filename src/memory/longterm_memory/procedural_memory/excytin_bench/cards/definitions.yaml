# Five-field cards; indexes and provenance remain outside model-facing content.
- id: url_to_message
  requires:
  - url
  produces:
  - message_id
  intents:
  - email
  - mail
  - sender
  - recipient
  - 邮件
  - 发件
  - 收件
  source_rule:
    table: EmailUrlInfo
    filters:
    - Url
    projection_any:
    - NetworkMessageId
  dependencies:
    EmailUrlInfo:
    - Url
    - NetworkMessageId
  card:
    name: 根据邮件内 URL 获取邮件标识
    inputs:
    - 已知 URL
    steps:
    - 在 EmailUrlInfo 按 Url 精确匹配，返回 NetworkMessageId 和 Url。
    outputs:
    - 邮件标识 NetworkMessageId
    constraints:
    - 一个 URL 可对应多封邮件，保留所有候选及关联；不证明发生点击。
- id: message_to_sender
  requires:
  - message_id
  produces:
  - sender
  intents:
  - sender
  - sent from
  - sending ip
  - 发件
  - 发送者
  - 发送 IP
  source_rule:
    table: EmailEvents
    filters:
    - NetworkMessageId
    projection_any:
    - SenderDisplayName
    - SenderFromAddress
    - SenderMailFromAddress
    - SenderIPv4
    - SenderIPv6
  dependencies:
    EmailEvents:
    - NetworkMessageId
    - SenderDisplayName
    - SenderFromAddress
    - SenderMailFromAddress
    - SenderIPv4
    - SenderIPv6
  card:
    name: 根据邮件标识查询发送信息
    inputs:
    - 已确认 NetworkMessageId
    - 所需信息是发件人身份还是发送 IP
    steps:
    - 在 EmailEvents 按 NetworkMessageId 查询；身份取 SenderDisplayName、SenderFromAddress、SenderMailFromAddress，发送 IP 取 SenderIPv4、SenderIPv6；返回邮件标识以保留关联。
    outputs:
    - 发件人显示名和地址或发送 IP
    constraints:
    - 不同发件字段不得混同；不能据此确认真实操作者；保留多候选和空值。
- id: message_to_recipient
  requires:
  - message_id
  produces:
  - recipient
  intents:
  - recipient
  - received
  - receiver
  - 收件
  - 接收邮件
  source_rule:
    table: EmailEvents
    filters:
    - NetworkMessageId
    projection_any:
    - RecipientEmailAddress
  dependencies:
    EmailEvents:
    - NetworkMessageId
    - RecipientEmailAddress
  card:
    name: 根据邮件标识查询收件人
    inputs:
    - 已确认 NetworkMessageId
    steps:
    - 在 EmailEvents 按 NetworkMessageId 查询 NetworkMessageId、RecipientEmailAddress，保留每封邮件对应的各收件人。
    outputs:
    - 收件人地址
    constraints:
    - 收件人不等于点击者；多个收件人不得压成一个人。
- id: message_to_url
  requires:
  - message_id
  produces:
  - url
  intents:
  - url
  - link
  - website
  - 网址
  - 链接
  source_rule:
    table: EmailUrlInfo
    filters:
    - NetworkMessageId
    projection_any:
    - Url
  dependencies:
    EmailUrlInfo:
    - NetworkMessageId
    - Url
  card:
    name: 根据邮件标识查询邮件内 URL
    inputs:
    - 已确认 NetworkMessageId
    steps:
    - 在 EmailUrlInfo 按 NetworkMessageId 查询 NetworkMessageId、Url。
    outputs:
    - 该邮件包含的 URL
    constraints:
    - 保留多条链接；邮件包含 URL 不证明恶意性或点击行为。
- id: delivery_to_message
  requires:
  - delivery_action
  produces:
  - message_id
  intents:
  - quarantine
  - zap
  - removed
  - delivery
  - 隔离
  - 移除
  - 投递
  source_rule:
    table: EmailPostDeliveryEvents
    filters:
    - Action
    projection_any:
    - NetworkMessageId
  dependencies:
    EmailPostDeliveryEvents:
    - Action
    - NetworkMessageId
    - InternetMessageId
    - RecipientEmailAddress
    - ThreatTypes
  card:
    name: 从投递后处理记录定位候选邮件
    inputs:
    - 目标处理动作及已知邮件范围
    steps:
    - 在 EmailPostDeliveryEvents 按 Action 检索目标动作，返回 NetworkMessageId、InternetMessageId、Action、RecipientEmailAddress、ThreatTypes；核对实际动作后选择相关候选，并保留日志记录的威胁分类。
    outputs:
    - 候选邮件标识、实际处理动作及邮件威胁分类
    constraints:
    - ZAP、remove、quarantine 不无条件等价；缺乏案件范围时只能返回候选，不能任选第一条；ThreatTypes 是邮件检测分类，不等于独立验证其中每个 URL 恶意。
- id: url_to_click
  requires:
  - url
  produces:
  - click
  - account_upn
  intents:
  - clicked
  - click
  - clicked on
  - 点击
  - 点击者
  source_rule:
    table: UrlClickEvents
    filters:
    - Url
    projection_any:
    - AccountUpn
    - IPAddress
    - Timestamp
  dependencies:
    UrlClickEvents:
    - Url
    - AccountUpn
    - IPAddress
    - Timestamp
    - ActionType
    - IsClickedThrough
  card:
    name: 根据 URL 查找点击相关事件
    inputs:
    - 已知 URL
    steps:
    - 在 UrlClickEvents 按 Url 查询 AccountUpn、IPAddress、Timestamp、ActionType、IsClickedThrough，结合实际动作解释是否点击或被阻止。
    outputs:
    - 点击相关账户、IP、时间和动作
    constraints:
    - 不把所有事件都解释为成功访问；IP 不能无条件当作设备唯一标识。
- id: ip_to_signin
  requires:
  - ip
  produces:
  - account
  - account_upn
  - user_id
  - application
  intents:
  - sign-in
  - signin
  - login
  - aad user
  - user id
  - application
  - 登录
  - 用户标识
  - 应用
  source_rule:
    table: SigninLogs
    filters:
    - IPAddress
    projection_any:
    - UserId
    - UserPrincipalName
    - UserDisplayName
    - AppId
    - AppDisplayName
  dependencies:
    SigninLogs:
    - IPAddress
    - UserId
    - UserPrincipalName
    - UserDisplayName
    - AppId
    - AppDisplayName
    - TimeGenerated
  card:
    name: 根据来源 IP 查询登录账户与应用
    inputs:
    - 已知来源 IP 及可用时间范围
    steps:
    - 在 SigninLogs 按 IPAddress 查询 UserId、UserPrincipalName、UserDisplayName、AppId、AppDisplayName、TimeGenerated，按当前目标选择输出。
    outputs:
    - 候选登录账户或应用及登录时间
    constraints:
    - 同一 IP 可对应多个账户；缺乏消歧证据不能任取一条；不根据地址本身认定恶意。
- id: file_to_command
  requires:
  - filename
  produces:
  - command
  - process
  intents:
  - command line
  - commandline
  - executed
  - process command
  - 命令行
  - 执行命令
  source_rule:
    table: DeviceProcessEvents
    filters:
    - FileName
    projection_any:
    - ProcessCommandLine
  dependencies:
    DeviceProcessEvents:
    - FileName
    - ProcessCommandLine
    - DeviceName
    - ProcessId
    - ProcessCreationTime
    - InitiatingProcessCommandLine
    - InitiatingProcessId
  card:
    name: 根据可执行文件名查询进程命令行
    inputs:
    - 目标可执行文件名
    steps:
    - 在 DeviceProcessEvents 按 FileName 查询 ProcessCommandLine、DeviceName、ProcessId、ProcessCreationTime，同时保留 InitiatingProcessCommandLine、InitiatingProcessId 以区分目标进程和启动它的父进程。
    outputs:
    - 候选目标进程和发起进程各自的命令行及身份
    constraints:
    - FileName 是可执行文件名；脚本参数不能直接当 FileName；目标进程与发起进程命令行不同；问题未明确区分时保留两者并标注角色，不能截去参数、重定向或启动包装命令。
- id: keyword_to_alert
  requires:
  - alert_topic
  produces:
  - alert_id
  intents:
  - alert
  - detected
  - incident
  - 告警
  - 检测
  source_rule:
    table: AlertInfo
    filters:
    - Title
    projection_any:
    - AlertId
  dependencies:
    AlertInfo:
    - Title
    - Category
    - AlertId
    - Timestamp
  card:
    name: 根据告警主题检索候选告警
    inputs:
    - 当前目标相关的告警主题
    steps:
    - 在 AlertInfo 按 Title 检索主题关键词，必要时结合 Category，返回 AlertId、Title、Category、Timestamp。
    outputs:
    - 候选 AlertId 及标题时间
    constraints:
    - 关键词命中仅表示候选，需结合当前背景筛选；不能据此确认攻击归属或因果。
- id: alert_to_evidence
  requires:
  - alert_id
  produces:
  - alert_entity
  intents:
  - associated
  - related
  - account
  - host
  - process
  - file
  - ip address
  - url
  - 关联
  - 账户
  - 主机
  - 进程
  - 文件
  - 地址
  source_rule:
    table: AlertEvidence
    filters:
    - AlertId
    projection_any:
    - AccountName
    - DeviceName
    - FileName
    - RemoteIP
    - RemoteUrl
    - ProcessCommandLine
    - AccountSid
  dependencies:
    AlertEvidence:
    - AlertId
    - EntityType
    - EvidenceRole
    - EvidenceDirection
    - DeviceName
    - FileName
    - ProcessCommandLine
    - AccountName
    - AccountSid
    - RemoteIP
    - RemoteUrl
  card:
    name: 根据告警标识获取关联实体证据
    inputs:
    - 当前调查已确认的 AlertId
    - 所需实体类型
    steps:
    - 在 AlertEvidence 按 AlertId 查询，保留 AlertId、EntityType、EvidenceRole、EvidenceDirection；按目标返回 DeviceName、FileName、ProcessCommandLine、AccountName、AccountSid、RemoteIP 或 RemoteUrl。
    outputs:
    - 带实体类型与角色的告警关联证据
    constraints:
    - 同告警包含多类实体，字段必须保留记录关联；关联实体不自动等于攻击发起者。
- id: account_to_signin
  requires:
  - account_upn
  produces:
  - signin_ip
  intents:
  - sign-in
  - signin
  - login
  - accessed
  - ip address
  - 登录
  - 访问 IP
  source_rule:
    table: SigninLogs
    filters:
    - UserPrincipalName
    projection_any:
    - IPAddress
  dependencies:
    SigninLogs:
    - UserPrincipalName
    - IPAddress
    - TimeGenerated
    - AppDisplayName
  card:
    name: 根据账户查询登录来源
    inputs:
    - 已确认账户 UPN 及已知时间范围
    steps:
    - 在 SigninLogs 按 UserPrincipalName 精确匹配，并应用已有时间范围，返回 IPAddress、TimeGenerated、UserPrincipalName、AppDisplayName。
    outputs:
    - 账户登录来源 IP 与时间
    constraints:
    - 显示名不是 UPN；多次登录应保留，不自动选择最早或最近一次作为攻击来源。
- id: sender_to_mail
  requires:
  - email_address
  produces:
  - message_id
  - sender
  intents:
  - sender
  - sent
  - sending
  - 发件
  - 发送
  source_rule:
    table: EmailEvents
    filters:
    - SenderFromAddress
    projection_any:
    - NetworkMessageId
    - SenderIPv4
    - RecipientEmailAddress
  dependencies:
    EmailEvents:
    - SenderFromAddress
    - NetworkMessageId
    - RecipientEmailAddress
    - SenderIPv4
    - SenderIPv6
    - Timestamp
  card:
    name: 根据发件地址定位邮件和发送 IP
    inputs:
    - 已确认为发件地址的邮箱
    steps:
    - 在 EmailEvents 按 SenderFromAddress 精确匹配，返回 NetworkMessageId、SenderFromAddress、RecipientEmailAddress、SenderIPv4、SenderIPv6、Timestamp，并按已有时间范围筛选。
    outputs:
    - 发出的邮件标识和发送 IP
    constraints:
    - 邮箱在背景出现不代表它是发件人；地址角色未确认时仅作探索候选。
- id: recipient_to_mail
  requires:
  - email_address
  produces:
  - message_id
  - recipient
  intents:
  - recipient
  - received
  - mailbox
  - 收件
  - 邮箱
  source_rule:
    table: EmailEvents
    filters:
    - RecipientEmailAddress
    projection_any:
    - NetworkMessageId
    - SenderFromAddress
  dependencies:
    EmailEvents:
    - RecipientEmailAddress
    - NetworkMessageId
    - SenderFromAddress
    - Subject
    - Timestamp
  card:
    name: 根据收件邮箱定位收到的邮件
    inputs:
    - 已确认为收件人的邮箱及已知范围
    steps:
    - 在 EmailEvents 按 RecipientEmailAddress 查询 NetworkMessageId、SenderFromAddress、Subject、Timestamp；使用已有时间或主题条件缩小范围。
    outputs:
    - 收到的候选邮件及邮件标识
    constraints:
    - 不能把任意背景邮箱当成收件人；查询返回的是候选邮件，仍需当前案件关联。
- id: remote_ip_to_network
  requires:
  - remote_ip
  produces:
  - network
  - command
  - url
  intents:
  - connection
  - network
  - remote
  - process
  - domain
  - network url
  - 网络
  - 外连
  - 远端
  source_rule:
    table: DeviceNetworkEvents
    filters:
    - RemoteIP
    projection_any:
    - RemoteUrl
    - InitiatingProcessCommandLine
    - InitiatingProcessFileName
  dependencies:
    DeviceNetworkEvents:
    - RemoteIP
    - RemoteUrl
    - DeviceName
    - LocalIP
    - Timestamp
    - InitiatingProcessId
    - InitiatingProcessFileName
    - InitiatingProcessCommandLine
  card:
    name: 根据远端 IP 反查网络活动及发起进程
    inputs:
    - 已知远端 IP
    steps:
    - 在 DeviceNetworkEvents 按 RemoteIP 查询 RemoteUrl、DeviceName、LocalIP、Timestamp、InitiatingProcessId、InitiatingProcessFileName、InitiatingProcessCommandLine，按问题选择字段。
    outputs:
    - 远端 URL 或连接的发起进程信息
    constraints:
    - LocalIP 与 RemoteIP 不能互换；网络事件的发起进程字段不等于任意目标进程字段。
- id: command_fragment_to_process
  requires:
  - command_fragment
  produces:
  - command
  - process
  - device
  intents:
  - command
  - script
  - process
  - host
  - 命令
  - 脚本
  - 进程
  - 主机
  source_rule:
    table: DeviceProcessEvents
    filters:
    - ProcessCommandLine
    projection_any:
    - DeviceName
    - ProcessCommandLine
  dependencies:
    DeviceProcessEvents:
    - ProcessCommandLine
    - DeviceName
    - FileName
    - ProcessId
    - ProcessCreationTime
  card:
    name: 根据命令片段或脚本名定位执行进程
    inputs:
    - 已知命令片段或脚本文件名
    steps:
    - 在 DeviceProcessEvents 的 ProcessCommandLine 中匹配已知片段，返回 DeviceName、FileName、ProcessId、ProcessCreationTime、ProcessCommandLine，核对完整命令。
    outputs:
    - 执行脚本或命令的进程与主机
    constraints:
    - 脚本通常位于解释器命令参数中，不应直接要求 FileName 等于脚本名；模糊匹配结果仅为候选。
- id: file_to_device
  requires:
  - file_artifact
  produces:
  - device
  intents:
  - host
  - device
  - computer
  - file
  - 主机
  - 设备
  - 文件
  source_rule:
    table: DeviceFileEvents
    filters:
    - FileName
    projection_any:
    - DeviceId
    - DeviceName
  dependencies:
    DeviceFileEvents:
    - FileName
    - DeviceId
    - DeviceName
    - FolderPath
    - Timestamp
    - ActionType
  card:
    name: 根据文件名定位相关设备事件
    inputs:
    - 已知文件名及可用路径或时间范围
    steps:
    - 在 DeviceFileEvents 按 FileName 查询 DeviceId、DeviceName、FolderPath、Timestamp、ActionType，并使用已有范围消歧。
    outputs:
    - 涉及该文件的候选设备和文件活动
    constraints:
    - 文件事件不等于执行事件；同名文件可能出现在多个设备，不自动认定攻击设备。
- id: account_to_click
  requires:
  - account_upn
  produces:
  - click
  - url
  intents:
  - click
  - clicked
  - url
  - link
  - 点击
  - 链接
  source_rule:
    table: UrlClickEvents
    filters:
    - AccountUpn
    projection_any:
    - Url
    - IPAddress
    - ReportId
  dependencies:
    UrlClickEvents:
    - AccountUpn
    - Url
    - IPAddress
    - Timestamp
    - ActionType
    - IsClickedThrough
  card:
    name: 根据账户查找点击相关 URL
    inputs:
    - 已确认账户 UPN 及可用时间范围
    steps:
    - 在 UrlClickEvents 按 AccountUpn 查询 Url、IPAddress、Timestamp、ActionType、IsClickedThrough，并使用已有时间范围。
    outputs:
    - 账户的点击相关 URL 和事件时间
    constraints:
    - 核对动作，不能把被阻止的事件解释为成功访问；当前仅有单个训练事件支持。
- id: topic_to_security_alert
  requires:
  - alert_topic
  produces:
  - alert_entity
  intents:
  - alert
  - detected
  - incident
  - 告警
  - 检测
  - 关联
  source_rule:
    table: SecurityAlert
    filters:
    - AlertName
    projection_any:
    - Entities
    - SystemAlertId
  dependencies:
    SecurityAlert:
    - SystemAlertId
    - AlertName
    - Description
    - Entities
    - TimeGenerated
    - CompromisedEntity
  card:
    name: 从安全告警内容提取相关实体
    inputs:
    - 明确的告警主题及已知案件范围
    steps:
    - 在 SecurityAlert 按 AlertName 或 Description 检索相关主题，返回 SystemAlertId、AlertName、TimeGenerated、Entities、CompromisedEntity；解析 Entities 时保留每个对象的 Type 与原始字段关联。 对进程身份问题，提取每个匹配对象的 ProcessId、CreationTimeUtc 与 ParentProcess 关系，解析 $id/$ref，分别标注父子对象；仅保留回答或消歧需要的字段。
    outputs:
    - 安全告警中的关联实体
    constraints:
    - SystemAlertId 不无条件等于 AlertInfo.AlertId；Entities 同列中的不同对象不能混成同一实体；关键词匹配不证明归属。 多个同名进程均匹配时，不得仅因某个命令含 encodedCommand 就认定它是题目唯一目标；应在任务中要求保留候选及角色，继续关联证据或明确歧义。
- id: internet_id_to_message
  requires:
  - internet_message_id
  produces:
  - message_id
  intents:
  - email
  - mail
  - url
  - sender
  - recipient
  - 邮件
  - 链接
  source_rule:
    table: EmailPostDeliveryEvents
    filters:
    - InternetMessageId
    projection_any:
    - NetworkMessageId
  dependencies:
    EmailPostDeliveryEvents:
    - InternetMessageId
    - NetworkMessageId
  card:
    name: 将邮件信头标识映射到服务邮件标识
    inputs:
    - 已确认 InternetMessageId
    steps:
    - 在 EmailPostDeliveryEvents 按 InternetMessageId 精确查询 InternetMessageId、NetworkMessageId。
    outputs:
    - NetworkMessageId
    constraints:
    - 两个标识语义不同，必须查询映射，不能直接互换；保留全部映射候选。
- id: filename_to_alert_evidence
  requires:
  - filename
  produces:
  - alert_id
  - alert_entity
  intents:
  - alert
  - evidence
  - account
  - sid
  - file
  - 告警
  - 证据
  - 账户
  - 文件
  source_rule:
    table: AlertEvidence
    filters:
    - FileName
    projection_any:
    - AlertId
    - AccountSid
    - AccountObjectId
  dependencies:
    AlertEvidence:
    - FileName
    - AlertId
    - EntityType
    - EvidenceRole
    - AccountSid
    - AccountObjectId
    - Title
  card:
    name: 根据可执行文件查找告警证据
    inputs:
    - 已知可执行文件名
    steps:
    - 在 AlertEvidence 按 FileName 查询 AlertId、Title、EntityType、EvidenceRole、FileName 及问题需要的 AccountSid 或 AccountObjectId，检查实体类型和字段实际取值。
    outputs:
    - 该文件相关的候选告警及账户证据
    constraints:
    - 文件类型记录中的账户字段可能为空；账户归属需额外关联，不能拿其他记录的账户直接补齐。
- id: upn_to_sid
  requires:
  - account_upn
  produces:
  - account_sid
  intents:
  - sid
  - security identifier
  - SID
  source_rule:
    table: IdentityLogonEvents
    filters:
    - AccountUpn
    projection_any:
    - AccountSid
  dependencies:
    IdentityLogonEvents:
    - AccountUpn
    - AccountSid
    - AccountObjectId
    - DeviceName
    - Timestamp
  card:
    name: 根据账户 UPN 查询 SID
    inputs:
    - 已确认账户 UPN
    steps:
    - 在 IdentityLogonEvents 按 AccountUpn 精确查询 AccountUpn、AccountSid、AccountObjectId、DeviceName、Timestamp；保留同记录关联。
