    constraints:
    - 程序名只用于发现候选；需结合 ActionType 确认是创建、修改还是删除，不能把全部文件事件都称为落地文件。
    - PowerShell 临时策略测试文件等正常文件不能仅因同一发起程序而判恶意；结果截断时继续按已知事件范围收敛。
- id: risk_status_to_user_candidates
