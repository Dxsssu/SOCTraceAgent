table_name: AZFWNatRuleAggregation
core_columns:
- name: NatRuleCount
  type: TEXT
  desc: 源类型 int；在 ExCyTIn MySQL 中以 TEXT 存储。该行所代表的 NAT 规则匹配的聚合数量。可用于衡量某规则、集合或来源的使用强度，而不是简单地统计行数。
- name: Policy
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。包含所触发 NAT 规则的防火墙策略名称。当部署了多个策略时，可用于将聚合流量归属到具体策略。
- name: Protocol
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。被聚合数据包的网络协议，例如 TCP 或 UDP。可据此筛选，区分不同协议的 NAT 使用情况并比较转换行为。
- name: Rule
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。匹配该聚合流量的 NAT 规则名称。以此为重点可发现哪些规则处于活动状态以及各自吸引的流量规模。
- name: RuleCollection
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。包含所匹配 NAT 规则的规则集合名称。可用于查看策略内各集合之间的流量分布。
- name: RuleCollectionGroup
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。包含所匹配规则的规则集合组名称。有助于在分析时追溯某条 NAT 规则所属的策略层级。
- name: SourceIp
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。被聚合数据包的源 IP 地址。可用于识别哪个客户端或网络产生了匹配 NAT 的流量，并按来源对转换记录进行分组。
- name: SourceSystem
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。产生该记录的代理或采集通道，例如 Azure 或 Operations Manager。在与其他日志关联时，可用于区分不同的数据接入路径。
- name: TenantId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与该记录关联的 Log Analytics 工作区 ID。用于将查询限定到正确的工作区；它不是目录租户标识符。
- name: TimeGenerated
  type: TEXT
  desc: 源类型 datetime；在 ExCyTIn MySQL 中以 TEXT 存储。该聚合对应的数据平面日志创建时间（UTC）。可用于按时间窗口筛选以及分析 NAT 活动的时间趋势。
- name: TranslatedIp
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。NAT 过程中替换数据包原始目标 IP 的地址。可用于确认匹配某规则的流量最终到达的转换端点。
- name: TranslatedPort
  type: TEXT
  desc: 源类型 int；在 ExCyTIn MySQL 中以 TEXT 存储。NAT 过程中替换数据包原始目标端口的端口。可结合 TranslatedIp 验证聚合流量的转换目标。
- name: Type
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该记录所属表的名称。在合并多个防火墙表时，可用于保持来源可区分。
- name: _ResourceId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该记录所关联资源的唯一标识符，通常是防火墙。可用于将表数据限定到某个防火墙资源。
