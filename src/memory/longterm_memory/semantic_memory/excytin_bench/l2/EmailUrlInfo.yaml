table_name: EmailUrlInfo
core_columns:
- name: NetworkMessageId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。Office 365 生成的、包含此 URL 的电子邮件消息标识符。可用于将同一邮件中的所有 URL 归组，并与其他邮件表关联；它不是 URL 级别的标识符。
- name: ReportId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。承载此 URL 的事件或报告记录的标识符。可用于将此 URL 行与对应的报告条目关联；不要假定它唯一标识电子邮件消息本身。
- name: SourceSystem
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。采集此 URL 记录的代理或连接器名称，例如 Office 365 管理代理。可用于在合并多个来源或工作区数据时区分采集途径。
- name: TenantId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与此 URL 记录关联的 Log Analytics 工作区标识符。可用于将查询限定到正确的工作区；根据文档，它是工作区 ID，而非 Azure 目录租户
    ID。
- name: TimeGenerated
  type: TEXT
  desc: 源类型 datetime；在 ExCyTIn MySQL 中以 TEXT 存储。此 URL 记录生成时的 UTC 日期和时间。可用作调查的主要时间过滤条件，并将 URL 发现相对于其他邮件事件放到时间线上。
- name: Timestamp
  type: TEXT
  desc: 源类型 datetime；在 ExCyTIn MySQL 中以 TEXT 存储。源服务记录该事件或观测的时间。用于限定调查时间范围及排列记录；应与进程创建时间或其他对象专属时间区分。
- name: Type
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此记录所属表的名称，通常为 EmailUrlInfo。可用于在同一工作区中查询多个邮件相关数据集时进行过滤或联合。
- name: Url
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。在 Office 365 电子邮件消息中发现的完整 URL 字符串。可用于检查完整链接目标、与已知恶意指标比对，并透视到 UrlDomain 进行分组；仅出现并不证明被点击。
- name: UrlDomain
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。从邮件中发现的 URL 提取出的域名部分。可用于按域聚合或狩猎、发现仿冒或新出现的域，并从可疑域透视到所有相关邮件。
- name: UrlLocation
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。指示 URL 出现在邮件的哪个部分，例如来源记录的正文或标头上下文。可用于在分类处置时优先关注可点击区域中的链接，而非可利用性较低的放置位置。
