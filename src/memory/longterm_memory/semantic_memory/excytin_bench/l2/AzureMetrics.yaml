table_name: AzureMetrics
core_columns:
- name: AdditionalInformation
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。附加到指标样本的服务特定补充信息。其结构未在文档中说明，因此应将其视为由名称推断，并在依赖前检查资源和类别上下文。
- name: Average
  type: TEXT
  desc: 源类型 real；在 ExCyTIn MySQL 中以 TEXT 存储。该指标在报告时间粒度内的平均值，与 Count 配合使用，可在样本量不同的资源或时段之间做归一化比较。
- name: CallerIpAddress
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。当服务记录时，与指标发出关联的源地址；文档标注为弃用，因此应视为由名称推断，并与活动或诊断日志相互印证。
- name: Category
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。指标记录的服务定义分类；文档标注为弃用。可在查询其他列前用它限定哪些资源或提供程序的指标共享同一架构。
- name: Confidence
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。附加到该行威胁指示器类数值的置信度；已弃用。此处的值属于证据元数据，并非已遭入侵的证明，因此应独立验证。
- name: CorrelationId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。用于关联相关服务记录的标识符；在本表中已弃用。若已填充，可用它将指标行与配套的诊断条目分组。
- name: Count
  type: TEXT
  desc: 源类型 real；在 ExCyTIn MySQL 中以 TEXT 存储。在时间范围内采集的样本数。可用它判断有多少数值参与了平均值，并对有噪声的指标比较进行加权或折减。
- name: Description
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。指标行上携带的自由文本描述；文档标注为弃用。其内容由服务定义，因此仅作为上下文注释阅读，而非权威分类。
- name: DurationMs
  type: TEXT
  desc: 源类型 long；在 ExCyTIn MySQL 中以 TEXT 存储。被测操作的持续时间（毫秒）；在本表中已弃用。若存在，可用于延迟趋势分析，而不用于为某个具体用户操作计时。
- name: FirstReportedDateTime
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与该行关联的威胁指示器首次报告的时间戳；已弃用。应将其视为参考元数据，而非指标本身发生的时间。
- name: IndicatorThreatType
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与该行关联的威胁指示器分类；已弃用。有值表示情报匹配，但这本身并不能确认已遭入侵。
- name: IsActive
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。指示关联指示器或记录当前是否活跃的标志；已弃用。可用它过滤过期的情报引用，并在资源上下文中核实该值含义。
- name: LastReportedDateTime
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该行威胁指示器最近一次报告的时间戳；已弃用。可与 FirstReportedDateTime 比较以判断指示器新旧，而非指标事件时间。
- name: MaliciousIP
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。被威胁情报标记为与该指标行相关地址；已弃用。匹配仅为调查证据，本身不能证明已遭入侵或存在恶意流量。
- name: Maximum
  type: TEXT
  desc: 源类型 real；在 ExCyTIn MySQL 中以 TEXT 存储。在时间范围内采集到的最高值。可用于发现同一粒度下平均值会掩盖的峰值、饱和或离群值。
- name: MetricName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。所报告指标的显示名称。可在跨资源比较数值前，用它选择具体的计数器，例如延迟或 CPU 百分比。
- name: Minimum
  type: TEXT
  desc: 源类型 real；在 ExCyTIn MySQL 中以 TEXT 存储。在时间范围内采集到的最低值。与 Maximum 和 Average 一起阅读，可了解指标在其粒度内的分布范围。
- name: OperationName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与指标关联的服务操作名称；在本表中已弃用。若已填充，可用它将指标趋势关联到特定 API 或管理操作。
- name: OperationVersion
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与该指标行关联的操作版本；已弃用。应将其理解为资源的架构或 API 版本标记，而非用户或代理版本。
- name: RemoteIPCountry
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该行记录的远程地址所解析到的国家；已弃用。仅用于粗略地理背景，因为解析来源和准确度均未在文档中说明。
- name: RemoteIPLatitude
  type: TEXT
  desc: 源类型 real；在 ExCyTIn MySQL 中以 TEXT 存储。该行远程地址所解析到的纬度；已弃用。应视为近似地理定位元数据，而非任何用户或设备的已验证位置。
- name: RemoteIPLongitude
  type: TEXT
  desc: 源类型 real；在 ExCyTIn MySQL 中以 TEXT 存储。该行远程地址所解析到的经度；已弃用。如需可配合纬度使用，但需知地理定位是近似的，不能证明来源。
- name: ReportReferenceLink
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。指向该行指示器数据相关外部报告的参考链接。结构未在文档中说明，因此应视为由名称推断，并在使用前验证链接来源。
- name: Resource
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。报告该指标资源的名称。在调查服务健康状况时，可用它将指标值和趋势归属到正确的资源。
- name: ResourceGroup
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。包含上报此指标样本的 Azure 资源的资源组。可用于将指标趋势限定到部署边界，或比较同一管理范围内的资源。
- name: ResourceId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。上报指标的资源的完整 Azure 资源 ID，为向后兼容保留。关联时优先使用 _ResourceId；当旧查询或导出仅包含 ResourceId 时使用此字段。
- name: ResourceProvider
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。上报资源的 Azure 资源提供程序命名空间，例如 Microsoft.Compute。可用于按服务类别分组指标，或验证指标名称是否属于预期的提供程序。
- name: ResultDescription
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。在 AzureMetrics 中已标记为弃用，其存在与否因行而异。仅将任何值视为基于名称的上下文，并在调查中依赖前结合 Resource 或 Category
    进行验证。
- name: ResultSignature
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。在 AzureMetrics 中已弃用，且填充不一致。不要用于指标分析；若出现值，应结合该行的 Resource 和 Category 上下文验证其含义。
- name: ResultType
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。文档说明用于缩减收集的数据集，允许的语法取决于操作。在此指标表中，将其解释为基于名称的查询或结果范围限定，并结合 Category 或 Resource
    上下文确认。
- name: Severity
  type: TEXT
  desc: 源类型 int；在 ExCyTIn MySQL 中以 TEXT 存储。在 AzureMetrics 中已标记为弃用，并非指标样本的可靠严重性。任何数值仅视为基于名称的字段，并检查 Resource、Category 和 MetricName
    以判断其是否有意义。
- name: SourceSystem
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。生成记录的代理或收集路径，例如 Azure Diagnostics 的 Azure。在跨资源聚合前，可用它区分不同摄取途径的指标。
- name: SubscriptionId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。包含上报指标资源的 Azure 订阅。可用于将指标查询限定到计费或安全边界，并与订阅级资源清单关联。
- name: TLPLevel
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。在 AzureMetrics 中已弃用，并非指标行可靠的 TLP 标记。任何值仅视为基于名称，共享前应结合 Description 或 AdditionalInformation
    验证。
- name: TenantId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。在此表中文档说明为工作区 ID，而非 Azure 目录租户 ID。可用于将查询限定到 Log Analytics 工作区；不要将其视为 Entra 租户标识符。
- name: TimeGenerated
  type: TEXT
  desc: 源类型 datetime；在 ExCyTIn MySQL 中以 TEXT 存储。指标记录在工作区中创建的日期和时间。结合 TimeGrain 用于限定趋势窗口，并将指标峰值与其他遥测时间线对齐。
- name: TimeGrain
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。指标样本的聚合间隔，例如 PT1M。可用于跨资源归一化数值，并避免比较聚合窗口不同的样本。
- name: Total
  type: TEXT
  desc: 源类型 real；在 ExCyTIn MySQL 中以 TEXT 存储。该资源与指标名称在时间范围内所有指标值的总和。适用于吞吐量或计数类指标，但在时间粒度不均时需结合 Count 进行比较。
- name: Type
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。表的名称，预期为 AzureMetrics。可用于跨表查询中的过滤或架构联合，并确认记录来自此指标表。
- name: UnitName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。指标的单位，例如 Seconds、Percent 或 Bytes。可用于正确解释 Total、Maximum、Minimum 和 Average，并避免在比较中混用不兼容的单位。
- name: _ResourceId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与指标记录关联的资源的唯一标识符，优于 ResourceId 的关联键。可用于将指标关联到资源清单及其他资源范围遥测。
- name: rn
  type: TEXT
  desc: 源类型 long；在 ExCyTIn MySQL 中以 TEXT 存储。导出数据中的行编号字段，不是安全事件标识。源架构未说明其排序规则；构建调查时间线应使用事件时间和实体标识。
