table_name: ThreatIntelligenceIndicator
core_columns:
- name: Action
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。名称推导：提供程序建议在本指标命中时采取的处置或处理动作，并非已观测事件。将取值视为阻止或允许前，请先检查指标及提供程序上下文。
- name: Active
  type: TEXT
  desc: 源类型 bool；在 ExCyTIn MySQL 中以 TEXT 存储。布尔标志，表示该指标在摄取时于情报源中是否处于启用状态。可用其纳入或排除仍然有效的指标；false 可能表示已停用，而非被证伪。
- name: ActivityGroupNames
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。提供程序将该指标归属到的威胁活动组织或行为体名称。可用于按行为体关联；归属仅为提供程序判断，并非该行为体已存在的确证证据。
- name: AdditionalInformation
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。附加在本指标上的分析人员或提供程序自由文本备注。可浏览其中的上下文、注意事项或处置指引；内容非结构化且因情报源而异。
- name: ApplicationId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。名称推导，无官方列说明：可能与本指标关联的应用程序或解决方案标识符。应检查资源/提供程序上下文，勿臆断为目录或应用注册语义。
- name: AzureTenantId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。名称推导，无官方列说明：似为指标所属的 Azure 租户范围。请检查指标与提供程序上下文；勿与本表中的工作区 TenantId 列混为一谈。
- name: ConfidenceScore
  type: TEXT
  desc: 源类型 real；在 ExCyTIn MySQL 中以 TEXT 存储。提供程序为本指标赋予的置信度评分，文档说明为 0 至 100。数值越高表示提供程序越确信；应作为权重使用，而非指标准确或命中即失陷的证据。
- name: Description
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。由提供程序或整理者提供的可读摘要，说明本指标代表什么。在依据此行命中采取行动前，请先阅读以了解意图与范围。
- name: DiamondModel
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本指标角色的钻石模型分类，文档说明为对手、能力、基础设施或受害者。可用于在狩猎或战役分析中按分析功能对指标分组。
- name: DomainName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本指标行所携带的域名可观测对象。可将其与 DNS、代理或邮件遥测匹配；命中表示接触了已知恶意域，并不代表已发生失陷。
- name: EmailEncoding
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本指标记录的邮件编码可观测对象，描述所引用邮件的编码特征。有助于缩小基于邮件的指标狩猎范围；并非投递或已阅读的证据。
- name: EmailLanguage
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本指标记录的邮件语言可观测对象，表示所引用邮件的语言。可用于按区域筛选邮件指标狩猎；其存在并不证明任何邮箱已接收该邮件。
- name: EmailRecipient
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与本指标关联的邮件收件人可观测对象，指明被针对或相关的邮箱。可据此关联针对同一收件人的其他指标；它并非成功投递的证据。
- name: EmailSenderAddress
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本指标的邮件发件人地址可观测对象，即所引用邮件的发件地址。可用于基于发件人的狩猎或拦截规则；应视为提供程序给出的情报，而非已观测的邮件流。
- name: EmailSenderName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本指标记录的邮件发件人显示名称可观测对象。在狩猎时与邮件遥测中的发件人名称比对；显示名称可被伪造，单凭它无法确定真实行为体。
- name: EmailSourceDomain
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本指标的邮件来源域可观测对象，即所引用邮件的来源域。可与邮件网关头信息关联；它反映提供程序情报，而非你环境中已确认的邮件来源。
- name: EmailSourceIpAddress
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本指标的邮件来源 IP 地址可观测对象，表示所引用邮件的发送位置。可用于 IP 关联；地址属共享基础设施，单凭其无法归属行为体。
- name: EmailSubject
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本指标的邮件主题可观测对象，即所引用邮件的主题行。可用于基于内容的邮件狩猎或过滤；应将其视为已知恶意情报，而非你租户中出现的邮件。
- name: EmailXMailer
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本指标的邮件 X-Mailer 头可观测对象，描述所引用邮件的发信客户端。可用于识别钓鱼工具指纹；它属提供程序情报，并非你的邮件流中确实包含它的证据。
- name: ExpirationDateTime
  type: TEXT
  desc: 源类型 datetime；在 ExCyTIn MySQL 中以 TEXT 存储。提供程序或整理者设定的本指标失效时间戳。可与 TimeGenerated 及当前时间比较以判断新鲜度；匹配检测时应考虑排除已过期指标。
- name: ExternalIndicatorId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。提交或来源系统为本指标分配的标识符。可用于将指标追溯回原始情报源或工单；它不是本记录的 Sentinel IndicatorId。
- name: FileCompileDateTime
  type: TEXT
  desc: 源类型 datetime；在 ExCyTIn MySQL 中以 TEXT 存储。本指标的文件编译时间戳可观测对象，即所引用文件的构建时间。可与终端的文件时间戳比较；它是关于已知恶意文件的情报，而非设备上实际出现的文件。
- name: FileCreatedDateTime
  type: TEXT
  desc: 源类型 datetime；在 ExCyTIn MySQL 中以 TEXT 存储。本指标记录的文件创建时间戳可观测对象。可用于与终端或存储日志中的文件元数据关联；该指标描述已知恶意文件，而非你主机上已确认的文件。
- name: FileHashType
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本指标中文件哈希可观测对象的哈希算法类型，如 MD5 或 SHA-256。在将 FileHashValue 与你的数据中的哈希比较前先检查它，避免算法不一致的比对。
- name: FileHashValue
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该指示器中文件名的哈希值。结合 FileHashType 与进程/文件遥测匹配。其存在表示它是指示器，并不代表该哈希已被观察到或本身即为恶意。
- name: FileMutexName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与此指示器中文件相关联的互斥体名称。在终端遥测中按互斥体名进行追踪以猎捕关联活动；此处的值是指示器属性，并非执行证据。
- name: FileName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该指示器的文件名可观测项。可与 FilePath 或 FileHashValue 一起关联文件创建、进程或恶意软件事件；它描述的是指示器的文件，而非主机上观察到的文件。
- name: FilePacker
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与此指示器中文件相关联的加壳工具。可作为猎捕或补充属性，按打包工具对指示器分组；其存在本身并不表示恶意或已在你的环境中被观察到。
- name: FilePath
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该指示器的文件路径可观测项。可与 FileName 或 FileHashValue 一起匹配终端文件及进程路径；它描述的是指示器的文件位置，而非遥测中观察到的路径。
- name: FileSize
  type: TEXT
  desc: 源类型 int；在 ExCyTIn MySQL 中以 TEXT 存储。与此指示器中文件相关联的大小。在研判基于文件的指示器时可作为筛选或分组属性；模式未指定单位，与观察到的文件大小比较前需确认量级。
- name: FileType
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该指示器的文件类型可观测项，例如格式或扩展名。在猎捕时可筛选或分组基于文件的指示器；它是指示器属性，并不判定匹配文件即为恶意。
- name: IndicatorId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。分配给该指示器的标识符，文档说明由接收系统计算。可用于去重、跟踪和跨指示器记录的关联；不应假定模式保证其唯一性。
- name: IndicatorProvider
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。提供该指示器的实体名称。可用于归因来源、权衡置信度、比较情报源并筛选可信来源；它描述的是指示器来源，而非行为者或目标。
- name: KillChainActions
  type: TEXT
  desc: 源类型 bool；在 ExCyTIn MySQL 中以 TEXT 存储。布尔标志，指示该指示器是否设置杀伤链值“actions”。在制定猎捕优先级时可按预期阶段筛选指示器；同一行可能有多个杀伤链标志为真。
- name: KillChainC2
  type: TEXT
  desc: 源类型 bool；在 ExCyTIn MySQL 中以 TEXT 存储。布尔标志，指示该指示器是否设置杀伤链值“C2”（命令与控制）。可用于隔离可能用于命令控制的基础设施；它是指示器的分类，并非活跃 C2 的证据。
- name: KillChainDelivery
  type: TEXT
  desc: 源类型 bool；在 ExCyTIn MySQL 中以 TEXT 存储。布尔标志，指示该指示器是否设置杀伤链值“delivery”。可用于优先处理投递阶段指示器（如恶意发件人或 URL）；标志为真只是对指示器分类，并非观察到投递事件。
- name: KillChainExploitation
  type: TEXT
  desc: 源类型 bool；在 ExCyTIn MySQL 中以 TEXT 存储。布尔标志，指示该指示器是否设置杀伤链值“exploitation”。可用于筛选与利用活动相关的指示器；该标志是指示器元数据，并不确认已发生利用。
- name: KillChainReconnaissance
  type: TEXT
  desc: 源类型 bool；在 ExCyTIn MySQL 中以 TEXT 存储。布尔标志，指示该指示器是否设置杀伤链值“reconnaissance”。可用于聚焦与早期探测相关的指示器；标志为真反映分类，并非确认对你的环境进行了侦察。
- name: KillChainWeaponization
  type: TEXT
  desc: 源类型 bool；在 ExCyTIn MySQL 中以 TEXT 存储。布尔标志，指示该指示器是否设置杀伤链值“weaponization”。可用于识别与武器化阶段相关的指示器；它是对指示器的分类，并不表示投递或入侵。
- name: KnownFalsePositives
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。描述该指示器可能产生误报情况的自由文本说明。研判时可用于评估噪声并制定抑制预期；它是提供方指导，并非良性或恶意的保证。
- name: MalwareNames
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。按文档所述，与该指示器关联的恶意软件家族或样本名称列表。可用于情报补充、追踪和按恶意软件家族分组；关联并不证明感染或指示器当前活跃。
- name: NetworkCidrBlock
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该指示器的网络 CIDR 块可观测项，表示一个范围而非单一地址。可用于匹配或聚合跨子网的指示器；列名未指定地址范围（源、目的或通用）。
- name: NetworkDestinationAsn
  type: TEXT
  desc: 源类型 int；在 ExCyTIn MySQL 中以 TEXT 存储。该指示器的目的自治系统编号可观测项。可用于按托管网络分组或补充指示器；模式未记录 ASN 格式或映射来源，使用前需核实。
- name: NetworkDestinationCidrBlock
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该指示器的目的网络 CIDR 块可观测项。在涉及出站连接的调查中可用于匹配流量范围；它描述指示器的目的范围，而非日志中观察到的范围。
- name: NetworkDestinationIP
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该指示器的目的 IP 地址可观测项。可用于将出站连接遥测与已知恶意目的匹配；出现在本表中意味着它是指示器，并不表示已被联系或确为恶意。
- name: NetworkDestinationPort
  type: TEXT
  desc: 源类型 int；在 ExCyTIn MySQL 中以 TEXT 存储。该指示器的目的端口可观测项。可与 NetworkDestinationIP 一起在猎捕时细化出站连接匹配；它是指示器属性，并非你环境中观察到的端口。
- name: NetworkIP
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该指示器的网络 IP 地址可观测项，未指定源/目的角色。在将其视为源或目的之前，应检查伴随字段和上下文；它是指示器值，并非联系证据。
- name: NetworkPort
  type: TEXT
  desc: 源类型 int；在 ExCyTIn MySQL 中以 TEXT 存储。该指示器的网络端口可观测项，未指定源/目的角色。需检查相关字段以确定端口上下文；它描述指示器，而非网络遥测中观察到的端口。
- name: NetworkProtocol
  type: TEXT
  desc: 源类型 int；在 ExCyTIn MySQL 中以 TEXT 存储。该指标网络活动的协议数值可观测项（例如 IP 协议号）；使用时应结合源/目标 IP 与端口字段，并在用于关联分析前确认其编码方式。
- name: NetworkSourceAsn
  type: TEXT
  desc: 源类型 int；在 ExCyTIn MySQL 中以 TEXT 存储。与该指标源网络地址关联的自治系统号；可用于按来源网络运营商对指标进行分组或过滤，解读时需确认 ASN 的表示约定。
- name: NetworkSourceCidrBlock
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。覆盖该指标源网络范围的 CIDR 块；可用于将指标匹配或限定到地址段而非单个地址，注意它描述的是指标的可观测项，而不是实时连接。
- name: NetworkSourceIP
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。为该指标记录的源 IP 地址可观测项；可用于将指标与观察到的网络流量进行匹配，但请记住这只是指标元数据，并不证明本租户中确实发生了流量。
- name: NetworkSourcePort
  type: TEXT
  desc: 源类型 int；在 ExCyTIn MySQL 中以 TEXT 存储。与该指标网络上下文关联的源端口可观测项；在限定匹配范围时应与协议、源 IP 和目标字段配合使用，并将匹配结果视为情报上下文，而非已确认的失陷。
- name: PassiveOnly
  type: TEXT
  desc: 源类型 bool；在 ExCyTIn MySQL 中以 TEXT 存储。该指标记录上的布尔标志，表明它是否不应生成用户可见的告警或触发事件；在筛选用于检测的指标与用于被动扩充的指标时使用，并遵循已记录的指标语义。
- name: SourceSystem
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。标识产生该指标记录的代理或收集路径，例如 Operations Manager、Linux 或 Azure Diagnostics；当指标元数据出现不一致时，可用它区分不同的摄取路径。
- name: Tags
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。附加到该指标记录的自由格式标记；可用于按提供方或分析人员提供的标签筛选或分组指标，但应将标签内容视为未经校验的文本，依赖前先检查其取值。
- name: TenantId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与该指标记录关联的 Log Analytics 工作区标识符；可用它将查询限定到正确的工作区，请勿将其解释为 Microsoft Entra 目录租户标识符。
- name: ThreatSeverity
  type: TEXT
  desc: 源类型 int；在 ExCyTIn MySQL 中以 TEXT 存储。分配给该指标的数值严重性评级，文档标称为 0 到 5，数值越高表示越严重；可用于对扩充结果进行优先级排序，但不能作为失陷的证据。
- name: ThreatType
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。分配给该指标的类型或类别，描述其代表的威胁种类；可用于按威胁类别对指标进行分组或过滤，应检查实际取值而不是假定存在固定枚举。
- name: TimeGenerated
  type: TEXT
  desc: 源类型 datetime；在 ExCyTIn MySQL 中以 TEXT 存储。根据文档，该指标记录被摄取到工作区的时间戳；可用于时间窗口过滤和新鲜度检查，但需注意摄取时间可能不同于指标创建或最近出现的时间。
- name: TrafficLightProtocolLevel
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该指标的 Traffic Light Protocol 共享级别，文档标称为 white、green、amber 或 red；在将指标纳入报告前，可用它判断指标的处理和共享限制。
- name: Type
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。存储该记录的表名称；通常为 ThreatIntelligenceIndicator，可用于验证表范围以及跨多个指标或日志源执行联合查询。
- name: Url
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。为该指标记录的 URL 可观测项；可用于与 Web 或电子邮件 URL 事件匹配，但其他日志中出现匹配 URL 仅表示被引用，并不代表有人点击或访问过它。
- name: UserAgent
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与该指标关联的用户代理字符串可观测项；可用于扩充或匹配 HTTP 相关遥测数据，并注意用户代理容易被伪造，因此匹配只是上下文而非证据。
- name: rn
  type: TEXT
  desc: 源类型 long；在 ExCyTIn MySQL 中以 TEXT 存储。导出数据中的行编号字段，不是安全事件标识。源架构未说明其排序规则；构建调查时间线应使用事件时间和实体标识。
