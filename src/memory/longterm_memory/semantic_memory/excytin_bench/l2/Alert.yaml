table_name: Alert
core_columns:
- name: AlertContext
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。触发此警报的数据项的 XML 格式详情。用它识别警报背后的具体受监控对象或值，并在得出结论前与源记录相互印证。
- name: AlertDescription
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。关于此警报含义及其触发原因的可读解释。可用于分诊上下文，但应将其视为生成文本；请对照查询和源数据核实所述条件。
- name: AlertError
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此警报的查询或评估失败时报告的错误文本。用它区分反映真实条件的警报和评估失败期间产生的警报，后者需单独处理。
- name: AlertId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此特定警报行的标识符。用它联接相关记录（如评论、修复作业或工单链接），并在关联事件时对重复出现去重。
- name: AlertName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。产生此行记录的警报规则所定义的警报名称。用于在分诊和报告期间按规则意图对警报活动进行分组和筛选。
- name: AlertPriority
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。分配给此警报的优先级。用于在分诊时按操作紧迫性排序或筛选警报，并与 AlertSeverity 比较以了解规则如何对此次发生进行分类。
- name: AlertRuleId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。生成此行记录的警报规则的标识符。用于关联同一规则的多次警报发生，并在评估警报行为是否符合预期时审查规则配置。
- name: AlertRuleInstanceId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与此行记录关联的警报规则执行的实例标识符。用于将一次规则评估产生的警报分组，有助于区分不同运行中的重复触发。
- name: AlertSeverity
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。分配给此警报的严重性级别。用于确定分诊优先级，并比较规则对此次发生的评级与 AlertPriority 及底层条件的关系。
- name: AlertState
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此警报的最新解决状态，指示其仍处于活动状态还是已解决。用于筛选当前与已关闭警报，并跟踪随时间的状态转换。
- name: AlertStatus
  type: TEXT
  desc: 源类型 int；在 ExCyTIn MySQL 中以 TEXT 存储。此警报的数值状态代码，是 AlertState 的补充。用于筛选或聚合警报工作流状态；应结合 AlertState 和 StateType 确认含义，而非假定固定映射。
- name: AlertTypeDescription
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。警报子系统记录的此警报类型的描述性文本。当仅凭规则名称不足以对检测类别进行分类时，用它分组相似警报。
- name: AlertTypeNumber
  type: TEXT
  desc: 源类型 int；在 ExCyTIn MySQL 中以 TEXT 存储。此警报类型的数值代码。在分诊期间与 AlertTypeDescription 一起按检测类别分组或筛选警报；该代码含义为遗留元数据，应加以核实。
- name: AlertUniqueId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。名称派生的标识符，似乎用于区分此警报记录。应结合 AlertId、资源和规则上下文检查以确认其唯一标识的对象；未经数据检查不要假定其唯一性。
- name: AlertValue
  type: TEXT
  desc: 源类型 int；在 ExCyTIn MySQL 中以 TEXT 存储。与此警报关联的数值，通常是满足规则阈值的测量结果。与 ThresholdValue 和 ThresholdOperator 一起使用，以了解条件为何评估为真。
- name: Comments
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。记录在此警报上的自由文本评论，通常在分诊或解决期间添加。用于记录分析员决策和交接备注，并查看解决是否合理。
- name: Computer
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与此警报的受监控对象或源关联的计算机名称。与 HostName 和时间范围一起使用，将活动限定到某设备；注意此处设备归属本身并不能证明该设备执行了恶意操作。
- name: Custom1
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此警报的管理员定义自定义字段。其内容取决于警报规则或管理包填充方式；在假定其含义前应检查周围的规则和资源上下文。
- name: Custom10
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此警报的管理员定义自定义字段。其内容取决于警报规则或管理包填充方式；在假定其含义前应检查周围的规则和资源上下文。
- name: Custom2
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此警报的管理员定义自定义字段。其内容取决于警报规则或管理包填充方式；在假定其含义前应检查周围的规则和资源上下文。
- name: Custom3
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此警报的管理员定义自定义字段。其内容取决于警报规则或管理包填充方式；在假定其含义前应检查周围的规则和资源上下文。
- name: Custom4
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此警报的管理员定义自定义字段。其内容取决于警报规则或管理包填充方式；在假定其含义前应检查周围的规则和资源上下文。
- name: Custom5
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此警报的管理员定义自定义字段。其内容取决于警报规则或管理包填充方式；在假定其含义前应检查周围的规则和资源上下文。
- name: Custom6
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此警报的管理员定义自定义字段。其内容取决于警报规则或管理包填充方式；在假定其含义前应检查周围的规则和资源上下文。
- name: Custom7
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本警报行上十个通用自定义字符串槽位中的第七个；内容由规则定义，因此应谨慎对待这一据名称推断的含义，使用前先查看警报规则或相邻 Custom 字段。
- name: Custom8
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本警报行上第八个通用自定义字符串槽位，仅当警报规则提供时才有值；应查看相关规则或类别上下文以确定本行实际存放的内容。
- name: Custom9
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本警报行上第九个通用自定义字符串槽位；无文档化语义，因此该值仅能据名称推断，调查使用前应结合来源警报规则验证。
- name: Expression
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。存储在本旧版警报行上的规则侧表达式或条件，描述警报如何被评估；用它重建产生此警报的逻辑，而不是作为受影响资源本身的证据。
- name: Flags
  type: TEXT
  desc: 源类型 int；在 ExCyTIn MySQL 中以 TEXT 存储。本警报行上编码警报规则选项的整数位域，在警报触发时设置；由于此处未记录各个位的含义，应结合 FlagsDescription 与 ValueFlags 字段一起解读。
- name: FlagsDescription
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。描述本行警报 Flags 位的人类可读文本；在分诊此警报为何被配置或触发时，用它将数值标志转换为可理解的含义。
- name: HostName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与本旧版警报关联的主机名，指明被监控的计算机或端点；查询时按主机和时间限定，以便与设备清单关联，因为它并非唯一对象标识符。
- name: LastModifiedBy
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。最后修改此警报的用户的名称，记录在警报对象上；用于审计谁在何时更改了警报状态、优先级或注释等问题。
- name: LinkToSearchResults
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。指向触发此旧版警报的搜索结果或查询的 URL；可借此跳转到来源查询上下文，但链接本身并不证明发生了任何结果。
- name: MG
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本警报行上缩写形式的管理组值；无官方列说明，因此仅属据名称推断的解读。断言其含义前请查看管理组或类别上下文。
- name: ManagementGroupName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与此警报关联的 System Center Operations Manager 代理的管理组名称；用于限定该行来自哪个被监控环境或集合。
- name: ObjectDisplayName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本警报所关注被监控对象的显示名称，即警报目标的展示名；结合 AlertUniqueId 与时间确定告警对象，但它不是持久资源标识符。
- name: PriorityNumber
  type: TEXT
  desc: 源类型 int；在 ExCyTIn MySQL 中以 TEXT 存储。分配给本警报行的数值优先级，与文本型 AlertPriority 不同；分诊时可用它按紧急程度排序或筛选旧版警报，并对照 AlertPriority 获取对应标签。
- name: Query
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。存储在本旧版警报行上的日志搜索查询文本，即结果触发警报的查询；查看它以理解检测逻辑，而非作为恶意活动已发生的证据。
- name: QueryExecutionEndTime
  type: TEXT
  desc: 源类型 datetime；在 ExCyTIn MySQL 中以 TEXT 存储。此警报规则查询评估结束的时间戳；与 QueryExecutionStartTime 配对可衡量搜索延迟，并将警报的检测窗口定位在时间线上。
- name: QueryExecutionStartTime
  type: TEXT
  desc: 源类型 datetime；在 ExCyTIn MySQL 中以 TEXT 存储。此警报规则查询评估开始的时间戳；与 QueryExecutionEndTime 结合可界定检测运行时间，并对旧版警报活动排序。
- name: RemediationJobId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。为修正此警报而调用的自动化作业标识符；可用它追踪是否以及运行了哪个自动响应，但仅有该 ID 并不能证明修正成功。
- name: RemediationRunbookName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。为本警报行配置或执行作为修正措施的 Runbook 名称；查看它以了解应执行哪个自动化，但不能作为其执行结果的证据。
- name: RepeatCount
  type: TEXT
  desc: 源类型 int；在 ExCyTIn MySQL 中以 TEXT 存储。自解决以来同一被监控对象再次生成同一警报的次数；结合对象与时间限定，用它评估复发频率与噪声警报。
- name: ResolvedBy
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。解决此警报的用户的名称（记录于警报对象上）；未解决时为空。与 TimeResolved 一起用于审计问责，注意它记录的是操作者，并不代表问题真正修复。
- name: ResourceId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此旧版警报所针对资源的 Azure 资源标识符；可借此关联资源清单或其他日志，但假设具体资源前应确认该字段确有值。
- name: ResourceType
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与本警报行关联的 Azure 资源类型，即资源种类名称；在混合环境中分诊时，用它按资源类别分组或筛选警报。
- name: ResourceValue
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本旧版警报所评估的被监控资源或对象中提取的值；其含义取决于规则，因此应结合警报规则与对象上下文解读，而非单独使用。
- name: RootObjectName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与此警报关联的根对象名称，记录于被监控层级中；用它把警报归因到顶层对象，区别于显示的目标名称。
- name: ServiceDeskConnectionName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。为该警报配置的服务台连接器名称，表示警报通过哪个外部工单集成发送。可用于查看哪些连接器处理了旧版警报；该解释基于字段名，需在连接器配置中核实。
- name: ServiceDeskId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。由所连接服务台系统为警报工单分配的标识符。可用于将警报记录关联回外部工单记录；仅当服务台集成创建了工单时才有值。
- name: ServiceDeskWorkItemLink
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。指向为该警报创建的服务台工单的链接 URL，便于调查人员跳转到外部工单。应视为引用指针，并不代表问题已解决。
- name: ServiceDeskWorkItemType
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。在集成工单系统中为该警报创建的服务台工单类型（例如事件或任务）。可与 TicketId、ServiceDeskId 结合，判断警报在外部是如何跟踪的。
- name: SourceDisplayName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。生成该警报的监控对象的显示名称，便于在列表中快速识别受影响组件。需要精确关联时应改用 SourceFullName 或 ResourceId。
- name: SourceFullName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。生成该警报的监控对象的完整名称，通常比显示名称更具限定性。当需要区分同名对象、追踪哪个受监控资源触发旧版警报时使用。
- name: SourceSystem
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。提供该警报记录的代理或采集通道类型，文档示例包括 OpsManager、Linux 或 Azure。在跨环境比较记录前，可借此确认该行的来源监控路径。
- name: StateType
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。描述该行警报生命周期状态的分类型取值（例如已触发或已解决类状态）。应结合 AlertState 及该字段用词理解；此处未穷尽记录其取值语义。
- name: StatusDescription
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。以可读文本描述警报状态，补充数字型 AlertStatus 字段。当需要了解警报为何处于当前状态的叙述性背景时使用。
- name: TemplateId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。定义该警报逻辑的警报规则模板标识符。可用于将使用同一检测模板的旧版警报归组，与 AlertRuleId 实例区分；模板语义依环境而异。
- name: TenantId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。按本架构文档用法，该字段是保存此警报行的 Log Analytics 工作区标识符，并非目录租户 ID；用于将查询限定到正确的工作区。
- name: ThresholdOperator
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。评估警报规则阈值时对监控值采用的比较运算符。与 ThresholdValue、AlertValue 一起阅读，可还原旧版规则为何触发。
- name: ThresholdValue
  type: TEXT
  desc: 源类型 int；在 ExCyTIn MySQL 中以 TEXT 存储。规则评估时所比较的数值阈值。结合 ThresholdOperator、AlertValue 与规则查询可理解触发条件；单位取决于规则定义，需查看该规则。
- name: TicketId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。当所在管理环境集成了警报工单流程时分配的工单标识符；未分配工单时为空。可用于将旧版警报与外部工单流程关联。
- name: TimeGenerated
  type: TEXT
  desc: 源类型 datetime；在 ExCyTIn MySQL 中以 TEXT 存储。该警报记录创建（即该行被引入）的日期和时间。可作为本表的主要时间过滤条件，并与 TimeRaised 比较以评估引入延迟。
- name: TimeLastModified
  type: TEXT
  desc: 源类型 datetime；在 ExCyTIn MySQL 中以 TEXT 存储。警报最后一次被更改（如状态更新）的日期和时间。与 TimeGenerated、TimeResolved 比较，可判断记录在创建后是否被修改过。
- name: TimeRaised
  type: TEXT
  desc: 源类型 datetime；在 ExCyTIn MySQL 中以 TEXT 存储。警报由规则实际生成的日期和时间。可用于真实警报时序及与 TimeResolved 计算驻留时间；可能与 TimeGenerated 的引入时间不同。
- name: TimeResolved
  type: TEXT
  desc: 源类型 datetime；在 ExCyTIn MySQL 中以 TEXT 存储。警报被解决的日期和时间；警报尚未解决时为空。可与 TimeRaised 一起计算警报持续时间，并筛选仍处于打开状态的旧版警报。
- name: TriggerId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与该警报触发关联的触发器实例标识符。含义由字段名推断；可用于归组可能源自同一次触发器评估的警报，并需在自身监控环境中核实其语义。
- name: Type
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该行所属表的名称，即警报表取值。当跨多个 Log Analytics 表进行联合查询时，可用该字段确认此行来自旧版 Alert 表。
- name: Url
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与该警报行关联的 URL 引用，通常是相关警报详情或搜索结果的链接。应视为导航指针；不要推断访问该链接即可证明底层条件成立。
- name: ValueDescription
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。对触发警报的取值的可读描述，说明本行 AlertValue 代表什么。可与 AlertValue 及规则定义结合，解释所涉指标或计数的含义。
- name: ValueFlags
  type: TEXT
  desc: 源类型 int；在 ExCyTIn MySQL 中以 TEXT 存储。与警报取值关联的数字标志位，其含义在本架构中未记录。可与 ValueFlagsDescription 及来源规则对照；该数字编码应视为规则特定。
- name: ValueFlagsDescription
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。对 ValueFlags 中标志位的文本说明。用它来解读标志位而不要猜测；内容依规则而定，可能为空。
- name: _ResourceId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此遗留警报记录所关联资源的 Azure 资源标识符。在与资源范围数据关联时可用它限定具体资源；纯工作区警报该值可能为空。
