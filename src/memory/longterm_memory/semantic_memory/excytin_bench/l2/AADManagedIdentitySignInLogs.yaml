table_name: AADManagedIdentitySignInLogs
core_columns:
- name: AppId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与托管标识登录关联的应用程序 GUID；可按同一应用聚合登录，发现异常或新出现的应用标识。
- name: AuthenticationContextClassReferences
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本次托管标识登录请求的身份验证上下文引用，表示适用的访问条件；可据此对比上下文强制与最终结果。
- name: AuthenticationProcessingDetails
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。处理本次托管标识登录的身份验证处理器详情；当结果异常时，可据此了解处理身份验证的机制或流程。
- name: Category
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。服务为本条托管标识登录记录打上的类别标签；用于限定查询范围并筛选记录类型，因为各类记录的类别可能不同。
- name: ConditionalAccessPolicies
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。应用于本次托管标识登录的条件访问策略详情；评估登录成功、失败或被质询原因时可据此查看已评估策略。
- name: ConditionalAccessPoliciesV2
  type: TEXT
  desc: 源类型 dynamic；在 ExCyTIn MySQL 中以 TEXT 存储。本次登录条件访问策略详情的有结构（动态）表示；此解释仅由字段名推断，使用前应检查 JSON 内容以确认字段与粒度。
- name: ConditionalAccessStatus
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本次托管标识登录条件访问策略的总体状态；可用于区分访问控制已满足、被阻止或未应用的登录。
- name: CorrelationId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。将本次托管标识登录与相关活动关联的标识符，用于重建轨迹；可跨记录连接以追踪身份验证与资源操作序列。
- name: DurationMs
  type: TEXT
  desc: 源类型 long；在 ExCyTIn MySQL 中以 TEXT 存储。本次托管标识登录操作的时长（毫秒）；异常长或短的时长可结合结果字段一并审查。
- name: FederatedCredentialId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本次托管标识登录所用联合身份凭据的标识符（如适用）；有助于判断是使用工作负载联合身份还是存储的密钥。
- name: IPAddress
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。发起本次托管标识登录的客户端 IP 地址；可用于发现来自陌生网络或地域的登录，但应结合其他证据确认归属。
- name: Id
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本条托管标识登录活动记录的唯一标识符；用于精确引用、去重或在跨数据源关联同一事件时连接。
- name: Identity
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。发出请求时所提供令牌中的身份（可能是用户账户、系统账户或服务主体）；应检查实际取值与上下文，而非假定类型。
- name: Level
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。服务为本次托管标识登录记录分配的严重性级别；可用于优先处理平台自身标记为值得注意的记录。
- name: Location
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。发出本次托管标识登录事件所在的资源区域；用于按上报区域过滤，勿与登录的地理来源混淆。
- name: LocationDetails
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本次托管标识登录的位置详情；应谨慎解读其结构化内容，并在归因实际来源前加以佐证。
- name: OperationName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本次托管标识事件记录的操作名称，文档说明为登录活动；查询时可用于将表范围限定为身份验证记录。
- name: OperationVersion
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本次托管标识登录中客户端请求的 REST API 版本；反映产生请求的 API 接口，并可帮助区分不同时间的客户端行为。
- name: ResourceDisplayName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本次托管标识事件中服务主体登录目标资源的显示名称；可用于查看某身份访问了哪些资源。
- name: ResourceGroup
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与本次托管标识登录日志关联的资源组；用于按部署分组限定查询范围，而非作为安全属性使用。
- name: ResourceIdentity
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。服务主体登录目标资源的标识符；可用于跨登录关联目标资源，并与资源侧活动连接。
- name: ResourceServicePrincipalId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本次托管标识登录中目标资源的服务主体标识符；在界定访问关系时应注意与发起登录的身份区分。
- name: ResultDescription
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本次托管标识登录操作未成功时的错误描述；请阅读实际文本以了解失败原因并开展后续查询。
- name: ResultSignature
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本次托管标识登录操作的错误代码（如有）；可按代码分组并分流失败情况，并对照实际取值核验其含义。
- name: ResultType
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本次托管标识身份验证的登录结果，通常为成功或失败状态。可用其筛选失败的身份验证，并结合 ResultDescription 或 ResultSignature
    查看错误上下文。
- name: ServicePrincipalCredentialKeyId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。服务主体在发起本次登录时所用凭据（证书或密钥）的密钥标识符。可将身份验证失败或异常激增关联到特定凭据；该字段为空可能表示使用密钥凭据或联合凭据流程。
- name: ServicePrincipalCredentialThumbprint
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。服务主体在本次登录中出示凭据的指纹，用于标识具体证书实例。结合 ServicePrincipalCredentialKeyId 可追踪哪份凭据材料完成了身份验证，并发现异常或已轮换的证书。
- name: ServicePrincipalId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。发起本次托管标识登录的服务主体的对象 ID。这是按工作负载标识聚合身份验证活动、并将失败或异常来源 IP 归因到某个主体的主要关联字段。
- name: ServicePrincipalName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。发起本次登录的服务主体的显示名称，在对象 ID 不熟悉时很有用。可按名称关联，回顾某一工作负载标识在不同时间与资源上的全部身份验证活动。
- name: SourceSystem
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。采集该记录的代理或管道，例如 Azure 诊断或 Log Analytics 代理。可用于了解采集来源，并区分经由不同监控路径收集的记录，但不代表标识本身的属性。
- name: TenantId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该记录关联的 Log Analytics 工作区 ID（按文档语义）。可用于将查询限定到单个工作区；不要将其视为 Microsoft Entra 目录租户标识符。
- name: TimeGenerated
  type: TEXT
  desc: 源类型 datetime；在 ExCyTIn MySQL 中以 TEXT 存储。事件生成时的 UTC 日期和时间，表示本次托管标识登录发生的时间。可用于时间窗口过滤、对身份验证序列排序，以及与资源或网络活动关联。
- name: Type
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。存储该记录的表的名称。在跨多个日志表的联合查询中可用于标识来源架构；对于本表的行，该值恒定。
- name: UniqueTokenIdentifier
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与本次登录事件相关联的令牌请求的唯一标识符。可用于将该身份验证记录与令牌颁发或下游资源访问活动关联，并对相关条目去重。
