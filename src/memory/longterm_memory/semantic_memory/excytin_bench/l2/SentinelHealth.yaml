table_name: SentinelHealth
core_columns:
- name: Description
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。对所记录操作及其结果的文字描述。先阅读它以了解发生了什么，再进一步查看 Reason 和 ExtendedProperties。
- name: ExtendedProperties
  type: TEXT
  desc: 源类型 dynamic；在 ExCyTIn MySQL 中以 TEXT 存储。附加于事件的、依资源类型而定的动态属性包。可解析以获取连接器、规则或自动化的具体细节；键名依服务而定，需谨慎解读，且基于名称推断。
- name: OperationName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。触发此运行状况事件的操作名称，描述正在执行的 Sentinel 动作。按它分组可查看哪些操作成功或失败最多。
- name: Reason
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。操作达到该状态的原因，例如错误或失败原因。结合 Status 与资源字段可诊断反复出现的 Sentinel 运行状况问题。
- name: RecordId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该运行状况条目的唯一记录标识符。可用于去重、引用或检索特定事件，而不是用于排序。
- name: SentinelResourceId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。记录其操作的 Sentinel 资源的 Azure 资源 ID。可用于连接或按资源筛选，定位到具体连接器、规则或自动化。
- name: SentinelResourceKind
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。资源类型下的具体种类，例如连接器种类或告警规则种类。取值需结合架构解读；种类字符串依服务而定，应检查资源上下文。
- name: SentinelResourceName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。涉及的 Sentinel 资源显示名称，例如连接器或分析规则名称。适用于分组以及查看与具名资源相关的失败报告。
- name: SentinelResourceType
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。Sentinel 资源的类别，按架构为 DataConnector、AlertRule 等。按它分组可比较各类资源的运行状况。
- name: SourceSystem
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。产生该事件的代理或收集来源，例如 Azure Diagnostics。当多条收集路径都会上报运行状况记录时，用它确认来源。
- name: Status
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。所记录操作的结果，例如成功、失败、警告、信息或部分成功。用它筛选以定位失败或降级的 Sentinel 资源。
- name: TenantId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与 Sentinel 运行状况记录关联的 Log Analytics 工作区 ID。查询时按工作区限定范围；它标识监控工作区，而非目录租户 ID。
- name: TimeGenerated
  type: TEXT
  desc: 源类型 datetime；在 ExCyTIn MySQL 中以 TEXT 存储。操作或运行状况事件生成的 UTC 时间戳。用于按时间窗口筛选，并将故障与连接器或规则变更进行关联。
- name: Type
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该记录的日志表名称，此处为 SentinelHealth。在联合查询或按表名跨多个日志表筛选时使用。
- name: WorkspaceId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。记录在运行状况事件上的工作区标识符。当多个工作区向同一表写入时，用它把健康查询限定到单个工作区。
