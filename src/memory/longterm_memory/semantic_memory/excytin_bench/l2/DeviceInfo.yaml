table_name: DeviceInfo
core_columns:
- name: AadDeviceId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本行所描述终结点在 Microsoft Entra ID 中的设备标识符。可用于将设备与 Entra 已加入的身份对象、登录或条件访问上下文关联；非 Entra
    设备可能为空，该字段本身不能证明设备在使用中。
- name: AdditionalFields
  type: TEXT
  desc: 源类型 dynamic；在 ExCyTIn MySQL 中以 TEXT 存储。该设备记录中标准列之外的动态扩展属性集合。可检查其键以发现服务特定的属性；各记录内容不同且为按名称推断，使用前应结合资源与类别上下文验证。
- name: AssetValue
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本行设备的业务价值或用户分配的价值等级，用于确定调查与响应优先级。它反映资产分类，不代表设备健康状况或是否被攻陷；应结合暴露面和活动证据使用。
- name: ClientVersion
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。上报该设备行的终结点代理或传感器版本。可与预期版本对比，发现代理过期或覆盖缺失；该值只证明代理版本，不能说明设备当前健康或在线。
- name: DeviceCategory
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本行设备所属的宽泛类别，例如终结点、网络设备、IoT 或未知。可用于将查询限定到目标资产类别，并在调查中过滤掉无关设备群体。
- name: DeviceId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。服务为本行所描述设备分配的唯一标识符。是关联告警、登录及其他终结点表的主要连接键；可用于限定设备级查询，并借助相关合并字段发现设备标识合并。
- name: DeviceName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本行所代表计算机的完全限定域名。可用于人类可读的识别、按主机名过滤以及交叉引用日志或告警文本；名称可能重复或被重用，应结合 DeviceId 确认。
- name: DeviceObjectId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本资产行记录的设备在 Microsoft Entra ID 中的目录对象标识符。可用于将计算机映射到目录对象；它是对象 ID 而非工作区租户 ID，未加入域的设备可能缺失。
- name: DeviceSubtype
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本设备类型的附加修饰，例如移动设备的平板与智能手机之别。仅当发现流程收集到足够信息时才填充；空白应视为未知而非特定子类型，并需结合设备类型和类别解读。
- name: DeviceType
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本行设备按功能划分的类型，例如工作站、服务器、移动设备、网络设备、游戏主机或打印机。可用于筛选相关主机并调整调查方向；分类依赖发现覆盖范围，可能不完整。
- name: ExclusionReason
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。当设备被排除在 Defender 漏洞管理体验之外时，说明排除原因的文本。可用于解释扫描或建议覆盖缺失；排除是管理状态，并不表示设备安全。
- name: ExposureLevel
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本行设备的暴露等级评估，概括其受威胁暴露程度。可用于确定加固与排查优先级；它是风险信号而非被攻陷证据，应结合告警或活动加以印证。
- name: IsAzureADJoined
  type: TEXT
  desc: 源类型 bool；在 ExCyTIn MySQL 中以 TEXT 存储。指示本行所描述计算机是否已加入 Microsoft Entra ID 的布尔值。调查身份与访问路径时，可用于区分云加入设备与其他设备；加入状态并不代表设备合规或可信。
- name: IsExcluded
  type: TEXT
  desc: 源类型 bool；在 ExCyTIn MySQL 中以 TEXT 存储。布尔值，表示该设备当前是否被排除在 Defender 漏洞管理体验之外。统计扫描或受管覆盖时可用于过滤被排除资产；排除反映配置状态，而非设备风险。
- name: IsInternetFacing
  type: TEXT
  desc: 源类型 bool；在 ExCyTIn MySQL 中以 TEXT 存储。指示本行所描述设备是否面向互联网的布尔值。可用于优先审查对外暴露资产；它是设备记录的暴露属性，不是正在遭受攻击或被攻陷的证据。
- name: JoinType
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本资产行记录的设备 Microsoft Entra ID 加入类型。追踪登录与策略行为时，可用于区分混合加入、已注册或云加入的计算机；解读时应结合加入标志和目录上下文。
- name: LoggedOnUsers
  type: TEXT
  desc: 源类型 dynamic；在 ExCyTIn MySQL 中以 TEXT 存储。捕获该记录时登录到计算机的用户动态列表，采用 JSON 数组形式。可用于将账户与主机关联；这只是快照，缺失不能证明从未登录，每个条目都应验证。
- name: MachineGroup
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本行记录的机器组，用于确定对设备的访问并应用组特定设置。可用于了解管理范围和组策略目标；它描述配置分配，不代表设备健康状况或用户身份。
- name: MergedDeviceIds
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。曾分配给本行所代表同一物理设备的先前设备标识符。关联历史数据时可用于解析重复或旧标识；这有助于合并身份，但本身不能确认设备可信或已被攻陷。
- name: MergedToDeviceId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。合并后分配给本行所描述设备的最新设备标识符。当历史遥测中出现旧标识时，可用它将查询规范化到当前 DeviceId；使用前应验证合并关系。
- name: Model
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本行设备来自厂商或制造商的型号名称或编号。可用于硬件盘点、发现异常或界定固件问题；仅当发现流程收集到足够详情时才可用，空白表示未知。
- name: OSArchitecture
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本行所描述计算机操作系统的架构，例如 64 位或 ARM。可用于将补丁、驱动程序或可利用性问题限定到兼容主机；它描述操作系统，而非已安装的应用程序二进制。
- name: OSBuild
  type: TEXT
  desc: 源类型 long；在 ExCyTIn MySQL 中以 TEXT 存储。本行计算机所运行操作系统的数字构建版本。可用于与补丁基线比较并发现过时主机；该编号因提供方而异，应结合平台已知构建映射进行解读。
- name: OSDistribution
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。本设备行记录的操作系统发行版，例如 Linux 上的 Ubuntu 或 RedHat。可用于限定 Linux 查询以及软件包或漏洞研究；空白表示发行版未知或不适用。
- name: OSPlatform
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该设备资产所报告的操作系统平台系列，用于在狩猎时按设备分组，并在限定范围时过滤无关操作系统系列。
- name: OSVersion
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该设备资产的操作系统版本字符串，用于在将设备清单与补丁或漏洞利用狩猎关联时识别过时或易受攻击的版本。
- name: OSVersionInfo
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该设备的操作系统版本补充详情，如市场名称或内部版本描述，当 OSVersion 过于简略、不便于报告时使用。
- name: OnboardingStatus
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该设备与 Defender for Endpoint 的载入状态，用于判断资产是否受主动监控，以及遥测缺失是否可能解释事件缺失。
- name: PublicIP
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。观察到的该设备连接 Defender 服务所用的公网 IP，可能属于设备本身、NAT 或代理；用于网络关联，不应视为固定标识。
- name: RegistryDeviceTag
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。通过注册表放置在该资产上的设备标记，用于在清单和分类限定期间按自定义组织标签分组或过滤。
- name: ReportId
  type: TEXT
  desc: 源类型 long；在 ExCyTIn MySQL 中以 TEXT 存储。该终端记录的来源报告计数标识，可能重复。识别记录时应结合 DeviceName 和 Timestamp，不应把 ReportId 单独当作全局唯一事件键。
- name: SensorHealthState
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该已载入设备上 EDR 传感器的健康状态，用于在狩猎前验证覆盖范围时解释遥测缺失或可见性下降。
- name: SourceSystem
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。采集该行的代理或管道（如 Operations Manager 或 Azure）；用于了解数据接入路径并按采集来源过滤记录。
- name: TenantId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与该记录关联的 Log Analytics 工作区标识符，而非目录租户 ID；在组合表查询时用它限定到正确的工作区。
- name: TimeGenerated
  type: TEXT
  desc: 源类型 datetime；在 ExCyTIn MySQL 中以 TEXT 存储。MDE 代理在终结点上记录此设备事件的时间；作为该表中当前设备状态的主要时间过滤条件。
- name: Timestamp
  type: TEXT
  desc: 源类型 datetime；在 ExCyTIn MySQL 中以 TEXT 存储。源服务记录该事件或观测的时间。用于限定调查时间范围及排列记录；应与进程创建时间或其他对象专属时间区分。
- name: Type
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该记录所属的表名，允许联合多个表的查询将 DeviceInfo 行与其他 Sentinel 来源区分开。
- name: Vendor
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。当发现过程提供足够细节时，该设备的产品供应商或制造商，用于清单分组并识别未受管理的硬件系列。
