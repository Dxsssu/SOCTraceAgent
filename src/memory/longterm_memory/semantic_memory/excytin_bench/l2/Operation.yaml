table_name: Operation
core_columns:
- name: Computer
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与此操作相关、具备 Log Analytics 代理成员资格的物理或虚拟机名称。调查中可按主机透视操作记录。
- name: CorrelationId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与同一整体操作遥测共享的 GUID。可用于关联同一活动在各表和操作中的记录。
- name: Detail
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。提供操作更多上下文的可读文本。可用于理解发生了什么并搜索特定消息，但应视为上下文描述而非结构化状态。
- name: ErrorId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。已弃用字段，可能保存失败操作的错误标识符。不应据此进行当前检测；断言失败原因前请结合 OperationStatus 和 Detail 核对。
- name: HelpLink
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。指向该操作附加上下文文档的参考 URL。当操作失败或需要解释时，可据此查找厂商指引。
- name: MG
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。从名称推断可能表示管理组或类似范围，官方无描述。应视为未证实，使用前请结合 ManagementGroupName 和 OperationCategory
    上下文核对。
- name: ManagementGroupName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。上报该操作的 System Center 代理所属 Operations Manager 管理组名称。多管理组调查时可用它将操作归属到特定管理组。
- name: OperationCategory
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。产生此操作记录的区域或组件名称。调查工作区活动时可用它按产生子系统分组和筛选操作。
- name: OperationKey
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。操作标识符，可为 GUID 或字符串。可用于对同一操作的记录分组或追踪，但文档未保证其在表中全局唯一。
- name: OperationStatus
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。操作结果描述，常见值如 Succeeded、Failed、Warning、Error。可用于筛选需要跟进或表明失败的工作区活动。
- name: Solution
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。产生该记录的托管解决方案或其他来源（如 RestAPI）。用于把操作归属到某解决方案，并区分服务通知与用户操作。
- name: SourceComputerId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与该操作关联的计算机唯一 GUID。即使显示的 Computer 名称重复或变化，也可用它可靠地将操作关联到某台机器。
- name: SourceSystem
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。标明提供该操作记录的采集通道，如 OpsManager、Linux 或 Azure。比较操作来源时可用它区分不同代理类型。
- name: TenantId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此日志记录关联的工作区标识符；当多个工作区写入同一表时用于限定查询范围，不代表目录租户 ID。
- name: TimeGenerated
  type: TEXT
  desc: 源类型 datetime；在 ExCyTIn MySQL 中以 TEXT 存储。操作记录创建的时间戳。可用于限定工作区变更或服务通知的时间窗口，并在调查中与其他表关联。
- name: Type
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。保存该记录的表名称。可用于查询和筛选，确认读取的是 Operation 表而非工作区中的其他类型。
- name: _ResourceId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与该操作记录关联的资源的唯一标识符。调查中可用于限定范围或将操作联接到特定工作区或资源。
