table_name: AlertInfo
core_columns:
- name: AlertId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。分配给该警报记录的标识符；可用于关联警报与相关事件，或跨服务关联重复警报。架构未保证其唯一性。
- name: AttackTechniques
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。归因于触发该警报活动的 MITRE ATT&CK 技术编号，可用于将检测映射到攻击者战术，辅助事件优先级排序和分组。
- name: Category
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该警报标识的威胁或入侵活动类型，即检测到的可疑行为类别；可用于跨服务对警报进行分类和趋势分析。
- name: DetectionSource
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。为该警报标记可疑活动的检测技术或传感器；有助于在分诊时区分是哪类检测层面产生的发现。
- name: ServiceSource
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。提供该警报的 Microsoft 产品或服务，例如终端、邮件或身份 Defender 工作负载；可用于按来源安全服务筛选警报。
- name: Severity
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。对该警报威胁或入侵活动评估的影响等级（高、中、低）；可用于筛选并确定优先调查哪些警报。
- name: SourceSystem
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。摄入该警报行的代理或采集通道，例如运维管理器或 Azure Diagnostics 路径；反映的是摄入管道而非威胁本身。
- name: TenantId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该警报记录的 Log Analytics 工作区标识符；用于将查询限定到单个工作区。根据文档，它是工作区 ID，而非目录租户 ID。
- name: TimeGenerated
  type: TEXT
  desc: 源类型 datetime；在 ExCyTIn MySQL 中以 TEXT 存储。该警报记录生成的 UTC 日期和时间；可用于时间范围过滤、时间线构建，以及与事件表在警报产生时刻的关联。
- name: Timestamp
  type: TEXT
  desc: 源类型 datetime；在 ExCyTIn MySQL 中以 TEXT 存储。源服务记录该事件或观测的时间。用于限定调查时间范围及排列记录；应与进程创建时间或其他对象专属时间区分。
- name: Title
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该警报的可读标题，描述检测到的威胁；可用于快速分诊、归并相似警报以及跨服务按关键字搜索。
- name: Type
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该警报行所属表的名称；在此架构中标识 AlertInfo 行，当跨多个表联合查询警报数据时可用于区分来源。
