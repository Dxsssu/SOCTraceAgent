table_name: IntuneOperationalLogs
core_columns:
- name: Category
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。Intune 操作事件的类别，表示产生该行的服务领域或操作分组。可先按它把调查范围限定到某个工作负载，再结合 OperationName 和 Result
    深入分析。
- name: OperationName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该行记录的 Intune 操作名称，即对服务执行或被服务执行的动作。可用它查找重复、异常或失败的管理与设备管理操作。
- name: Properties
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。保存该事件操作相关细节的自由格式负载。可解析其中目标对象、设置和标识符；由于结构未文档化，使用前应先查看实际取值，不要预设内部字段。
- name: Result
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该行操作报告的结果，用于区分成功、失败或其他状态。可用它筛选失败的 Intune 操作，并优先关注可能产生影响的管理动作。
- name: SourceSystem
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。按本模式中 SourceSystem 的语义，表示投递该事件的代理或采集通道。在与工作区其他表关联 Intune 操作时，可用于确认数据来源和采集链路。
- name: TenantId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该记录所在 Log Analytics 工作区的工作区标识，并非目录租户 ID。查询多个工作区时，可用它把查询限定到正确的工作区。
- name: TimeGenerated
  type: TEXT
  desc: 源类型 datetime；在 ExCyTIn MySQL 中以 TEXT 存储。Intune 操作事件生成的时间戳。可作为主要时间过滤条件，并在还原操作活动顺序时用于排序。
- name: Type
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该行所属表的名称。在查询中合并多张表时，可用于确认记录来自 IntuneOperationalLogs。
