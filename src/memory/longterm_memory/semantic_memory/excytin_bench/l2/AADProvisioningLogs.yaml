table_name: AADProvisioningLogs
core_columns:
- name: AADTenantId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。产生此行预配活动的 Azure AD 租户的唯一标识符。用于将调查限定到单个目录租户，并区分其他租户或工作区的活动。
- name: Action
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该字段无官方说明，解释基于名称。可视为预配操作标签；在用于筛选前，请检查该行的 OperationName、ProvisioningAction 和 Category
    上下文。
- name: Category
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此预配行的事件类别，指示记录的预配活动类型。用于在分析结果前筛选或分组异构流。
- name: ChangeId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此变更在预配周期内的唯一标识符。与 CycleId 和 JobId 一起使用，可深入查看具体变更并关联相关预配步骤。
- name: CorrelationId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。将相关预配事件串联成轨迹的标识符。用于重建一个预配流在源系统和目标系统上的操作顺序。
- name: CycleId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。预配作业一次迭代的唯一标识符。与 JobId 一起使用，可检查重复运行、区分周期并比较不同迭代的结果。
- name: DurationMs
  type: TEXT
  desc: 源类型 long；在 ExCyTIn MySQL 中以 TEXT 存储。此预配操作的持续时间（毫秒）。用于查找缓慢或停滞的预配操作，并比较不同作业、周期或目标系统的性能。
- name: Id
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此预配活动记录的唯一标识符。在与其他日志源关联时，用于引用或去重单个行。
- name: InitiatedBy
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。发起此预配操作的人员或主体的详细信息。解析它以将预配活动归因于用户、应用程序或服务主体，并区分自动同步与手动操作。
- name: JobId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。整个预配作业的唯一标识符。用于将属于同一同步作业的所有变更和周期分组，并跟踪该作业随时间的结果。
- name: ModifiedProperties
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此预配操作对受影响对象更改的每个属性的详细信息。用于识别更新了哪个属性并检测意外或敏感修改。
- name: OperationName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。为此行记录的预配操作名称。用于对操作分类、按操作类型筛选，并比较不同预配运行的行为。
- name: OperationVersion
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。客户端为此预配操作请求的 REST API 版本。用于识别涉及的客户端 API 版本并诊断与版本相关的故障。
- name: ProvisioningAction
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此预配步骤的活动或操作名称。用于在分析结果时识别执行的具体操作，例如创建、更新或删除对象。
- name: ProvisioningStatusInfo
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此操作预配状态的详细信息。用于丰富成功或失败分析，并理解预配操作为何达到该结果。
- name: ProvisioningSteps
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此预配操作期间执行的每个步骤的详细信息。用于跟踪细粒度进度并定位操作失败或停滞的确切阶段。
- name: ResultDescription
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。预配操作可用时的错误描述。用于详细了解失败原因，并在不同作业或目标中搜索重复出现的错误消息。
- name: ResultSignature
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。预配操作返回的错误代码（如有）。用于对故障分类、归并类似错误，并比较不同周期或目标系统的错误模式。
- name: ResultType
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。预配操作的结果，例如 Success、Failure 或 Skipped。用于筛选结果、衡量失败率，并识别值得审查的已跳过预配活动。
- name: ServicePrincipal
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。用于此预配操作的服务主体。用于将活动归因于在目标系统上操作的预配连接器或应用程序身份。
- name: SourceIdentity
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此操作中正在预配的源对象的详细信息。用于识别从源系统读取的用户、组或对象，并追溯其预配历史。
- name: SourceSystem
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。收集事件的代理类型，例如 OpsManager、Linux 或 Azure。用于区分收集管道并按来源监控系统筛选行。
- name: StatusInfo
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。无官方说明、解释基于名称的字段。可视为额外的预配状态详细信息；在得出结论前，请与 ResultType、ResultSignature 和 ProvisioningStatusInfo
    一起检查。
- name: TargetIdentity
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此操作中正在预配的目标对象的详细信息。用于识别写入目标系统的用户、组或对象，并验证传播情况。
- name: TargetSystem
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。标识接收预配对象的目标系统或应用（如 SaaS 应用或目录）。可与 TargetIdentity 搭配，限定操作影响的连接器目标，并比较不同目标的失败情况。
- name: TenantId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。承载此记录的 Log Analytics 工作区 ID。用于将查询限定到某个工作区；它并非目录租户标识，目录租户另由 AADTenantId 表示。
- name: TimeGenerated
  type: TEXT
  desc: 源类型 datetime；在 ExCyTIn MySQL 中以 TEXT 存储。预配事件记录的 UTC 日期和时间。可用于时间范围过滤、对同一周期内的步骤排序，以及将预配活动与相关登录或审核事件关联。
- name: Type
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。提供该记录的表的名称；此处标识 AADProvisioningLogs 的行。用于筛选或将此预配数据与其它 Azure Monitor 表联合查询。
