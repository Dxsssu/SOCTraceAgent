table_name: AADNonInteractiveUserSignInLogs
core_columns:
- name: AlternateSignInName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此非交互式登录记录的备用登录标识，通常是本地 UPN 或电话号码。调查时与 UserPrincipalName 对比，可发现备用身份使用或身份形式不一致。
- name: AppDisplayName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此非交互式登录所面向应用或资源的可读名称。用于查看哪些应用产生静默令牌活动，并对异常应用访问进行分组。
- name: AppId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此登录所涉及应用的 GUID。当显示名称含糊或缺失时，可用其可靠地关联登录、与服务主体对应并对活动分组。
- name: AppliedEventListeners
  type: TEXT
  desc: 源类型 dynamic；在 ExCyTIn MySQL 中以 TEXT 存储。名称推断的、关于此登录期间触发的身份验证事件监听器的结构化数据。其语义未完全文档化，应结合身份验证详情和资源上下文查看，勿假定固定含义。
- name: AuthenticationContextClassReferences
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。应用于此非交互式登录的身份验证上下文引用，关联条件访问身份验证上下文定义。用于核实哪一受保护资源上下文管理了该令牌请求。
- name: AuthenticationDetails
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此非交互式登录所执行每步身份验证的结构化记录。用于了解令牌如何获取，以及是否意外出现交互或 MFA 步骤。
- name: AuthenticationMethodsUsed
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。列出此登录期间使用的身份验证方法。与 AuthenticationRequirement 对比，可检查该非交互式请求是否满足所需 MFA 或方法约束。
- name: AuthenticationProcessingDetails
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。处理此登录的身份验证处理器所提供的详情。当登录失败或出现异常处理时，作为 ResultType 和 ResultDescription 的辅助证据，而非单独依据。
- name: AuthenticationProtocol
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此非交互式身份验证使用的协议或授权类型。审查自动化登录成功或失败方式时，用于区分令牌流，如客户端凭据类或资源所有者流。
- name: AuthenticationRequirement
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。指示此登录要求单因素还是多因素身份验证。用于核实非交互式请求是否预期需要 MFA，以及该要求是否实际满足。
- name: AuthenticationRequirementPolicies
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。对此登录施加身份验证要求的条件访问和每用户策略集合。用于将 MFA 或策略要求归因到具体策略名称。
- name: AutonomousSystemNumber
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与此登录客户端 IP 网络关联的自治系统号。调查时可与 IPAddress 结合，刻画来源网络及托管或 ISP 属性。
- name: Category
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此非交互式登录事件在 Azure Monitor 诊断流中的类别。用于限定查询范围，并区分同一工作区中的其他类别活动。
- name: ClientAppUsed
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。标识此非交互式登录所用的客户端应用或身份验证方式，如新式与旧式客户端。用于发现与自动化访问相关的旧式或异常客户端活动。
- name: ConditionalAccessPolicies
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此登录所应用条件访问策略的详情，记录于该较早格式字段中。用于确定评估了哪些策略，尤其在缺失 V2 数据时。
- name: ConditionalAccessPoliciesV2
  type: TEXT
  desc: 源类型 dynamic；在 ExCyTIn MySQL 中以 TEXT 存储。名称推断的、此登录较新的结构化条件访问策略数据；确切结构未完全文档化。应结合登录和策略上下文查看，勿假定字段。
- name: ConditionalAccessStatus
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此登录条件访问评估的总体结果，如成功、失败或未应用。用于快速筛选被策略阻止或质询的登录。
- name: CorrelationId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。用于跨相关活动和日志追踪此非交互式登录的标识符。调查时可关联登录、应用事件及下游审核记录。
- name: CreatedDateTime
  type: TEXT
  desc: 源类型 datetime；在 ExCyTIn MySQL 中以 TEXT 存储。此非交互式登录发生时的源事件时间戳。用于排列活动顺序、与其他遥测关联，并与 TimeGenerated 对比以判断摄取延迟。
- name: CrossTenantAccessType
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。描述此登录是否及如何跨租户边界，如 B2B 协作或直连。可与本租户和资源租户字段结合，分析跨租户自动化访问。
- name: DeviceDetail
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与此非交互式登录关联的设备详情。由于静默登录常缺少设备上下文，应谨慎对待有值的记录，并与设备清单来源相互印证。
- name: DurationMs
  type: TEXT
  desc: 源类型 long；在 ExCyTIn MySQL 中以 TEXT 存储。此事件所记录登录操作的持续时间（毫秒）。用于比较应用或用户间的操作耗时，作为性能信号，而非身份属性。
- name: HomeTenantId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。涉及此非交互式登录的跨租户场景中的本租户标识符。可与资源租户字段结合，区分用户来源租户与所访问资源租户。
- name: IPAddress
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此非交互式登录客户端的 IP 地址。可与 AutonomousSystemNumber 和位置字段结合，评估来源网络、重复使用及异常来源。
- name: Id
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。Entra ID 为此登录活动记录分配的唯一标识符；用于引用或去重单个身份验证事件。它不是导出行号，因此不要将其作为序列计数器进行连接。
- name: Identity
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。生成日志时提供的令牌中的身份字符串；可能代表用户账户、系统账户或服务主体。基于名称的推测：应检查令牌上下文，不要假定为人类用户。
- name: IsInteractive
  type: TEXT
  desc: 源类型 bool；在 ExCyTIn MySQL 中以 TEXT 存储。布尔值，指示此身份验证是否为交互式；非交互式记录很重要，因为它们通常代表后台令牌获取而不是直接用户操作。用它来区分静默流与会话活动。
- name: IsRisky
  type: TEXT
  desc: 源类型 bool；在 ExCyTIn MySQL 中以 TEXT 存储。布尔标记，指示 Entra ID 在事件发生时是否将此登录评估为有风险。true 是检测证据，并非入侵证明；需结合风险详情和其他日志佐证。
- name: Level
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。分配给日志记录本身的严重性级别，用于在分类过程中过滤噪声或高严重性条目。应结合 ResultType 解释，而不是将其视为确定性的身份验证结果。
- name: Location
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。发出日志条目的资源区域，通常是工作区区域。它不是用户的实际登录位置；请使用 LocationDetails 获取该信息。
- name: LocationDetails
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。关于登录位置的结构化详情，例如从客户端 IP 推导出的城市、国家和地理坐标。基于名称的推测：在断言具体子字段之前，请检查其类别/资源上下文。
- name: MfaDetail
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。有关此登录执行的多重身份验证的详细信息（如有）。用于确定 MFA 是否成功、使用了哪种方法，并支持身份验证强度或绕过的调查。
- name: NetworkLocationDetails
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。提供与此登录身份验证处理器相关的详细信息，有助于区分网络或处理器上下文。解释基于名称推测；在依赖具体值之前，请检查资源和类别字段。
- name: OperationName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与日志记录关联的操作；对于登录条目，预期为登录活动值。用于筛选此表中的登录事件，并限定其他操作类型的范围。
- name: OperationVersion
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。客户端为此身份验证请求的 REST API 版本，指示所用协议版本。可用于兼容性和基线检查，但本身不是身份验证结果。
- name: OriginalRequestId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。身份验证序列中第一个请求的请求 ID，可串联同一流程中相关的登录步骤。用它来分组属于同一次逻辑身份验证尝试的事件。
- name: ProcessingTimeInMs
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。身份验证服务内请求处理时间（毫秒），以字符串形式报告。用于性能或异常分析；需谨慎转换，并按资源和时间限定范围。
- name: ResourceDisplayName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。用户登录的资源或服务的友好名称，例如应用程序或 API。用于映射非交互式身份验证期间访问了哪些下游系统。
- name: ResourceGroup
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与日志关联的资源组，反映 Azure Monitor 摄取上下文而非登录目标。用于按工作区部署限定查询范围，不用于身份调查。
- name: ResourceIdentity
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。用户登录的资源的标识符，通常是目标的服务主体或应用程序 ID。用于在调查中将登录与特定受保护资源关联。
- name: ResourceServicePrincipalId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。被访问资源的服务主体 ID，在 Entra ID 中标识应用程序或服务。用于透视到服务主体配置、权限及相关登录。
- name: ResourceTenantId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。跨租户场景中资源的租户 ID，与本地租户不同。用于检测和调查非交互式身份验证流中的跨租户访问。
- name: ResultDescription
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。登录结果的人类可读描述，包括身份验证失败时的错误说明。用于分类失败原因，并区分策略阻止与凭据问题。
- name: ResultSignature
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。包含登录操作的错误代码（如有），提供简洁的状态信号。用于按错误类型筛选或分组身份验证尝试中的失败。
- name: ResultType
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。登录操作的整体结果，通常为 Success 或 Failure。在搜寻失败的非交互式身份验证或验证令牌成功签发时，将其用作主要结果筛选条件。
- name: RiskDetail
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。提供与此登录相关的风险用户状态的详细信息，解释为何分配或修正风险。与风险级别和状态字段一起使用；仅风险证据不能证明入侵。
- name: RiskEventTypes
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与此登录关联的风险事件类型列表，采用旧版字符串表示。用于识别触发了哪些检测；应将其视为检测遥测，而非确认的入侵。
- name: RiskEventTypes_V2
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。采用更新字符串格式的与此登录关联的风险事件类型列表。在关联检测时与 RiskEventTypes 一起使用；在有值时应优先使用此版本。
- name: RiskLevelAggregated
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。Microsoft Entra ID Protection 归因于该非交互式登录或用户的聚合风险级别。值升高时，应在断定遭到入侵前检查 RiskDetail、RiskState
    及相关登录。
- name: RiskLevelDuringSignIn
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该非交互式登录发生当下评估的风险级别。与 RiskLevelAggregated 对比，可判断风险是实时发现的还是事后才检测到的。
- name: RiskState
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。用户或此登录的风险检测状态，例如风险已修正、已忽略还是仍然存在。与风险级别和详情字段结合使用，判断尚未处置的暴露。
- name: ServicePrincipalId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。当发起身份是应用而非用户时，此登录由该服务主体发起。用它将非交互式身份验证归因于特定的工作负载或应用注册。
- name: SessionLifetimePolicies
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。应用于此登录的会话生存期策略与设置，决定令牌/会话时长或吊销。用于解释调查中出现的异常长寿命或被强制终止的会话。
- name: SignInEventTypes
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与此非交互式登录关联的类型，例如刷新令牌或托管标识流。有助于将事件定位到身份验证生命周期中，并区分令牌刷新与其他登录形式。
- name: SignInIdentifierType
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。所用登录标识符的类别，例如用户主体名称或电话号码（依据名称推断，需结合类别上下文确认）。指示身份验证时提交的是哪种标识符形式。
- name: SourceSystem
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。收集此行的代理或管道，例如 Azure 诊断或 Windows 代理。在数据来自多个收集器时，用于确认引入路径并限定查询范围。
- name: Status
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此事件的登录结果详情，身份验证失败时通常包含错误代码。是区分成功获取令牌与被阻止或失败尝试的关键字段。
- name: TenantId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。存储该登录记录的 Log Analytics 工作区标识符，并非目录租户 ID。在工作区之间关联同一身份时，用它限定查询范围。
- name: TimeGenerated
  type: TEXT
  desc: 源类型 datetime；在 ExCyTIn MySQL 中以 TEXT 存储。此非交互式登录事件生成并引入的 UTC 日期时间。是按时间窗口筛选、排序以及与该尝试前后其他遥测关联的主要轴。
- name: TokenIssuerName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。在此登录中签发令牌的身份提供程序名称，例如 Microsoft 安全令牌服务。用其确认是哪个颁发机构完成了该请求的身份验证。
- name: TokenIssuerType
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。支持此非交互式登录的身份提供程序类型，例如云目录或联合身份验证服务。用于检测特定用户或应用出现意外联合路径的情况。
- name: Type
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。提供此行的表名。在跨表联合查询中，用于将非交互式登录事件与其他日志源区分开。
- name: UniqueTokenIdentifier
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。与此请求中令牌唯一关联的标识符。用于关联相关登录之间的令牌签发或重用，并诊断可疑的令牌重放。
- name: UserAgent
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。此非交互式登录中呈现的客户端用户代理字符串。有助于刻画获取令牌的客户端库、脚本或工具，包括异常或旧版客户端。
- name: UserDisplayName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。该行记录其登录的用户的显示名称。便于可读的报告，但可靠关联和透视应优先使用 UserId 或 UserPrincipalName。
- name: UserId
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。发起此非交互式登录的用户的 object identifier。是加入目录对象并跨日志关联该身份活动的稳定键值。
- name: UserPrincipalName
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。发起此非交互式登录的身份的用户主体名称。是按用户跨应用和 IP 分组其令牌活动的主要可读透视字段。
- name: UserType
  type: TEXT
  desc: 源类型 string；在 ExCyTIn MySQL 中以 TEXT 存储。登录身份在租户中是成员还是来宾（可能存在未知的将来值）。来宾登录敏感资源应受到额外审查。
- name: rn
  type: TEXT
  desc: 源类型 long；在 ExCyTIn MySQL 中以 TEXT 存储。导出数据中的行编号字段，不是安全事件标识。源架构未说明其排序规则；构建调查时间线应使用事件时间和实体标识。
