log_sources:
- table: AADManagedIdentitySignInLogs
  desc: 专门记录 Microsoft Entra 托管标识的身份验证活动。
  entities:
  - application
  - ip
  - managed_identity
  - resource
  - service_principal
  - workspace
- table: AADNonInteractiveUserSignInLogs
  desc: 存储非交互式 Microsoft Entra ID 用户登录事件，例如令牌刷新、后台服务和客户端活动。
  entities:
  - application
  - host
  - ip
  - resource
  - service_principal
  - tenant
  - user
  - workspace
- table: AADProvisioningLogs
  desc: 记录源系统与目标系统之间的身份预配操作，包括相关身份、属性修改、处理步骤和结果。
  entities:
  - identity
  - service_principal
  - tenant
  - workspace
- table: AADRiskyUsers
  desc: 记录 Identity Protection 对用户账户的风险评估及其更新。
  entities:
  - user
  - workspace
- table: AADServicePrincipalSignInLogs
  desc: 记录 Microsoft Entra 应用服务主体的身份验证。
  entities:
  - application
  - ip
  - resource
  - service_principal
  - workspace
- table: AADUserRiskEvents
  desc: 记录 Identity Protection 针对用户账户产生的具体风险检测。
  entities:
  - ip
  - user
  - workspace
- table: AZFWApplicationRule
  desc: Azure 防火墙应用规则日志条目，来自数据平面，每条记录对应一次与应用程序规则集合匹配的请求。
  entities:
  - domain
  - ip
  - resource
  - url
  - workspace
- table: AZFWApplicationRuleAggregation
  desc: 该表是 Azure 防火墙为 Policy Analytics 生成的应用程序规则聚合日志：每行按规则/策略路径和请求属性分组，汇总一段时间内的多起相似应用程序规则匹配，而非一次连接一行。
  entities:
  - domain
  - ip
  - resource
  - url
  - workspace
- table: AZFWDnsQuery
  desc: Azure 防火墙 DNS 代理查询日志，每一行代表防火墙代客户端处理的一次 DNS 查询，来源为防火墙数据平面。
  entities:
  - domain
  - ip
  - resource
  - workspace
- table: AZFWFlowTrace
  desc: 记录 Azure Firewall 流跟踪诊断，包括源和目标端点、协议、标志位、操作及原因。
  entities:
  - ip
  - resource
  - workspace
- table: AZFWIdpsSignature
  desc: Azure 防火墙 IDPS 签名命中记录：每行对应一个在 Azure 防火墙资源上被一个或多个入侵检测/防御签名匹配的数据平面数据包。
  entities:
  - ip
  - resource
  - workspace
- table: AZFWNatRule
  desc: 记录 Azure Firewall 目标 NAT 规则匹配，包含原始目标、转换后的目标、来源及策略层级。
  entities:
  - ip
  - resource
  - workspace
- table: AZFWNatRuleAggregation
  desc: 记录供 Policy Analytics 使用的 Azure Firewall NAT 规则使用汇总。
  entities:
  - ip
  - resource
  - workspace
- table: AZFWNetworkRule
  desc: 记录 Azure Firewall 网络规则决策，包含源和目标 IP、端口、协议、操作及策略层级。
  entities:
  - ip
  - resource
  - workspace
- table: AZFWNetworkRuleAggregation
  desc: Azure 防火墙 Policy Analytics 聚合网络规则日志数据。
  entities:
  - ip
  - resource
  - workspace
- table: AZFWThreatIntel
  desc: 记录 Azure Firewall 流量与威胁情报指标的匹配，包含观测到的端点、URL 或 FQDN、威胁描述及防火墙操作。
  entities:
  - domain
  - ip
  - resource
  - url
  - workspace
- table: Alert
  desc: 记录传统监控和日志搜索告警，包括触发规则或查询、阈值、受监控资源、生命周期时间及修复引用。
  entities:
  - alert
  - host
  - identity
  - resource
  - workspace
- table: AlertEvidence
  desc: AlertEvidence 每一行代表与某个安全警报关联的一个实体：文件、IP、URL、用户、设备、进程或邮件。
  entities:
  - alert
  - application
  - domain
  - file
  - host
  - ip
  - mail_id
  - process
  - registry
  - url
  - user
  - workspace
- table: AlertInfo
  desc: 由 Microsoft Defender 系列服务（Defender for Endpoint、Office 365、Cloud App Security、Defender for Identity）生成的警报记录，每个警报事件一行，包含严重性与
    MITRE 分类信息。
  entities:
  - alert
  - workspace
- table: Anomalies
  desc: 此表的每一行记录由 Microsoft Sentinel 中的活动异常分析规则所生成的异常，每条规则产生的异常对应一行，包含其生命周期、评分和模板元数据。
  entities:
  - entity
  - host
  - ip
  - user
  - workspace
- table: AuditLogs
  desc: 来自 Microsoft Entra ID 目录活动的审核日志，记录谁执行了目录操作、操作作用于哪些目标对象以及操作是否成功。
  entities:
  - identity
  - resource
  - tenant
  - workspace
- table: AzureMetrics
  desc: 记录 Azure 资源的性能与健康指标及时间粒度；不是网络连接日志，保留的 IP 等旧字段不代表可可靠调查通信。
  entities:
  - resource
  - workspace
- table: CloudAppEvents
  desc: 记录云应用中的账户活动、应用标识、来源 IP 和操作对象；账户类型由 AccountType 判断。
  entities:
  - application
  - entity
  - identity
  - ip
  - workspace
- table: DeviceEvents
  desc: Defender for Endpoint 高级搜寻事件，覆盖传感器上报的多种终结点活动类型，包括安全控制类与进程相关事件。
  entities:
  - domain
  - file
  - host
  - ip
  - process
  - registry
  - url
  - user
  - workspace
- table: DeviceFileCertificateInfo
  desc: 记录文件签名与证书验证信息，关联设备、文件 SHA1、签名者、颁发者及信任状态；不能据此认定文件安全。
  entities:
  - certificate
  - file
  - host
  - url
  - workspace
- table: DeviceFileEvents
  desc: Defender for Endpoint 的文件系统遥测：每行表示受管设备上一次观察到的文件创建、修改、重命名或相关文件操作。
  entities:
  - domain
  - file
  - host
  - ip
  - process
  - url
  - user
  - workspace
- table: DeviceImageLoadEvents
  desc: 来自 Microsoft Defender for Endpoint 并转发到 Microsoft Sentinel 的终结点 DLL/镜像加载遥测。
  entities:
  - domain
  - file
  - host
  - process
  - user
  - workspace
- table: DeviceInfo
  desc: 该表来自 Microsoft Defender for Endpoint，是设备资产清单快照，每行代表一条终结点记录，包含设备标识、操作系统、代理版本和暴露面元数据。
  entities:
  - host
  - ip
  - user
  - workspace
- table: DeviceLogonEvents
  desc: 该表来自 Defender for Endpoint，记录受监控设备上的登录及其他身份验证事件，每一行对应一次登录尝试或会话。
  entities:
  - domain
  - file
  - host
  - ip
  - process
  - user
  - workspace
- table: DeviceNetworkEvents
  desc: Microsoft Defender for Endpoint 的网络连接遥测：每行记录在终结点上观测到的一次网络事件（通常是连接尝试），并关联到发起进程及其账户。
  entities:
  - domain
  - file
  - host
  - ip
  - process
  - url
  - user
  - workspace
- table: DeviceNetworkInfo
  desc: Defender for Endpoint 设备网络信息表，来自 MDE 代理：每行描述某设备某网络适配器在某一采集时间的网络属性，包括适配器、IP/MAC 地址、DNS 与网关、连接的网络及隧道类型。
  entities:
  - host
  - ip
  - network_adapter
  - workspace
- table: DeviceProcessEvents
  desc: 记录 Microsoft Defender for Endpoint 的进程创建及相关事件。
  entities:
  - domain
  - file
  - host
  - process
  - user
  - workspace
- table: DeviceRegistryEvents
  desc: 记录终端注册表操作，包括受影响的键和值、日志中保留的旧值、发起进程及账户。
  entities:
  - domain
  - file
  - host
  - process
  - registry
  - user
  - workspace
- table: EmailAttachmentInfo
  desc: 记录 Microsoft Defender for Office 365 处理的邮件关联附件，包括文件名、类型、大小、SHA256、发件人、收件人及威胁检测元数据。
  entities:
  - file
  - mail_id
  - user
  - workspace
- table: EmailEvents
  desc: 记录 Microsoft Defender for Office 365 的邮件处理信息，包括发件人、收件人、身份验证结果、威胁判定、投递操作及位置。
  entities:
  - domain
  - ip
  - mail_id
  - user
  - workspace
- table: EmailPostDeliveryEvents
  desc: 记录 Microsoft Defender for Office 365 在邮件投递后执行的安全操作，包括操作、触发来源、结果、位置和收件人。
  entities:
  - mail_id
  - user
  - workspace
- table: EmailUrlInfo
  desc: 记录从邮件中提取的 URL、域名及其在邮件中的位置。
  entities:
  - domain
  - mail_id
  - url
  - workspace
- table: Heartbeat
  desc: Heartbeat 记录由 Log Analytics 代理约每分钟发出一次，用于报告代理运行状况。
  entities:
  - host
  - ip
  - resource
  - workspace
- table: IdentityDirectoryEvents
  desc: IdentityDirectoryEvents 记录身份与目录相关活动，例如密码更改或过期以及用户主体名称变更，来自身份目录遥测并写入 Log Analytics。
  entities:
  - domain
  - host
  - ip
  - user
  - workspace
- table: IdentityLogonEvents
  desc: IdentityLogonEvents 保存来自本地 Active Directory 及相关身份源的认证活动记录，每行对应一次登录、登录尝试或认证操作事件。
  entities:
  - domain
  - host
  - ip
  - user
  - workspace
- table: IdentityQueryEvents
  desc: 该表来自 Microsoft Defender for Identity，记录对 Active Directory 对象（如用户、组、设备、域）执行的目录查询，每行一次查询事件。
  entities:
  - domain
  - entity
  - host
  - ip
  - user
  - workspace
- table: IntuneAuditLogs
  desc: Intune 审核日志记录 Intune 设备管理平面中的管理性和服务性操作，并导出到工作区。
  entities:
  - identity
  - workspace
- table: IntuneDeviceComplianceOrg
  desc: 记录 Microsoft Intune 设备合规报告，包含合规状态、设备健康威胁等级、所有权、操作系统、用户及最近联系时间。
  entities:
  - host
  - resource
  - tenant
  - user
  - workspace
- table: IntuneDevices
  desc: IntuneDevices 保存从 Microsoft Intune 导出并采集到 Log Analytics 的托管设备清单记录，每行对应一台设备的快照。
  entities:
  - host
  - tenant
  - user
  - workspace
- table: IntuneOperationalLogs
  desc: IntuneOperationalLogs 记录 Microsoft Intune 服务发出并采集到 Log Analytics 工作区的操作事件，通常每个针对 Intune 租户执行的操作对应一行。
  entities:
  - workspace
- table: LASummaryLogs
  desc: Summary Logs 记录 Log Analytics 汇总规则的执行情况，每个规则的时间分箱执行产生一行，包含状态、耗时、结果计数和错误信息。
  entities:
  - resource
  - rule
  - workspace
- table: MicrosoftAzureBastionAuditLogs
  desc: 由 Azure Bastion 服务生成的会话审计记录，每行代表一个会话生命周期事件（开始、结束、连接），用于通过浏览器以 RDP/SSH 访问 VM。
  entities:
  - ip
  - resource
  - session
  - user
  - workspace
- table: MicrosoftGraphActivityLogs
  desc: MicrosoftGraphActivityLogs 记录针对租户内资源发起的 Microsoft Graph API 请求，每行对应一次 Graph 请求，由工作区收集。
  entities:
  - application
  - ip
  - service_principal
  - url
  - user
  - workspace
- table: OfficeActivity
  desc: OfficeActivity 保存 Microsoft 365 各工作负载（Exchange、SharePoint、Teams 等）产生并被采集到工作区的审核记录。
  entities:
  - application
  - domain
  - entity
  - file
  - ip
  - resource
  - tenant
  - url
  - user
  - workspace
- table: Operation
  desc: Operation 记录影响 Log Analytics 工作区的运维活动，既有用户发起的操作，也有数据上限等服务通知。
  entities:
  - host
  - resource
  - workspace
- table: SecurityAlert
  desc: 记录 Microsoft Sentinel 安全告警的受影响实体、严重性、检测上下文、状态及修复信息。
  entities:
  - alert
  - entity
  - host
  - resource
  - workspace
- table: SecurityIncident
  desc: 记录 Microsoft Sentinel 安全事件的生命周期，包括状态、严重性、负责人、分类、活动时间范围及关联告警。
  entities:
  - alert
  - identity
  - incident
  - workspace
- table: SentinelAudit
  desc: 记录 Microsoft Sentinel 资源审计，包括操作、状态、资源身份及自定义 ExtendedProperties。
  entities:
  - resource
  - workspace
- table: SentinelHealth
  desc: Microsoft Sentinel 资源运行状况日志，记录由数据连接器、分析规则、自动化等 Sentinel 资源执行的操作。
  entities:
  - resource
  - workspace
- table: SigninLogs
  desc: 记录 Microsoft Entra 用户登录，包括账户、应用、来源 IP、身份验证步骤、条件访问决策和风险上下文。
  entities:
  - application
  - host
  - ip
  - resource
  - service_principal
  - tenant
  - user
  - workspace
- table: ThreatIntelligenceIndicator
  desc: Microsoft Sentinel 威胁情报指标记录，每行是从提供程序或情报源导入的一条指标，包含其可观测对象和元数据。
  entities:
  - application
  - domain
  - file
  - indicator
  - ip
  - tenant
  - url
  - user
  - workspace
- table: UrlClickEvents
  desc: UrlClickEvents 记录 Microsoft Defender for Office 365 的 URL 点击事件：每行代表用户从 Email、Office 或 Teams 中选择或请求某个 URL，由 Safe Links/点击防护管道生成。
  entities:
  - ip
  - mail_id
  - url
  - user
  - workspace
- table: Usage
  desc: 记录工作区各日志表按小时汇总的摄取用量与计费信息；ResourceUri 表示工作区资源，不是访问过的网址。
  entities:
  - log_table
  - resource
  - workspace
